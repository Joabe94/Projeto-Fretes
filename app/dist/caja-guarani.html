<script>
"use strict";
/* ==================================================================== */
/*  MOTOR DE CALCULO                                                     */
/*  Reproduz as mesmas regras do sistema Excel V1. Roda uma vez a cada   */
/*  mudanca de dados; todas as telas leem o resultado.                   */
/* ==================================================================== */
const Calc = {
  derivar(d) {
    const cfg = d.config, hoje = cfg.dataRef;
    const idx = {
      conta: by(d.contas, "id"), cartao: by(d.cartoes, "id"), inv: by(d.investimentos, "id"),
      cat: by(d.categorias, "id"), sub: by(d.subcategorias, "id"), cmp: by(d.compromissos, "id"),
      meta: by(d.metas, "id"), parc: by(d.parcelas, "id"), rec: by(d.recorrencias, "id"),
      inst: by(d.instituicoes, "id"),
    };
    const ent = new Map();
    d.contas.forEach((x) => ent.set(x.id, { tipo: "CONTA", nome: x.nome }));
    d.cartoes.forEach((x) => ent.set(x.id, { tipo: "CARTAO", nome: x.nome }));
    d.investimentos.forEach((x) => ent.set(x.id, { tipo: "INVESTIMENTO", nome: x.nome }));

    /* ---------- 1. lancamentos enriquecidos ---------- */
    const L = d.lancamentos.map((l) => {
      const cl = CLASSIF[l.tipo] || "TIPO INVALIDO";
      const oc = l.origemTipo === "CONTA", dc = l.destinoTipo === "CONTA";
      const e = {
        ...l, classificacao: cl,
        categoriaNome: l.categoriaId ? (idx.cat.get(l.categoriaId)?.nome ?? "?") : "",
        subcategoriaNome: l.subcategoriaId ? (idx.sub.get(l.subcategoriaId)?.nome ?? "?") : "",
        origemNome: l.origemTipo === "EXTERNO" ? "(Externo)" : (ent.get(l.origemId)?.nome ?? "?"),
        destinoNome: l.destinoTipo === "EXTERNO" ? "(Externo)" : (ent.get(l.destinoId)?.nome ?? "?"),
        entradaCaixa: dc && !oc ? l.valor : 0,
        saidaCaixa: oc && !dc ? l.valor : 0,
        vRec: cl === "RECEITA" ? l.valor : 0,
        vDesp: cl === "DESPESA" ? l.valor : 0,
        vRend: cl === "RECEITA_FINANCEIRA" ? l.valor : 0,
        efConta: (dc ? l.valor : 0) - (oc ? l.valor : 0),
        efCartao: (l.origemTipo === "CARTAO" ? l.valor : 0) - (l.destinoTipo === "CARTAO" ? l.valor : 0),
        efInv: (l.destinoTipo === "INVESTIMENTO" ? l.valor : 0) - (l.origemTipo === "INVESTIMENTO" ? l.valor : 0),
        compet: Dt.compet(l.data), ano: Dt.parts(l.data).y, mes: Dt.parts(l.data).m,
      };
      e.validacao = Calc.validarLanc(e, idx, ent);
      e.vinculos = [l.compromissoId, l.parcelaId, l.metaId, l.recorrenciaId, l.relacionadoId].filter(Boolean);
      return e;
    });
    const R = L.filter((l) => l.status === "REALIZADO");
    const P = L.filter((l) => l.status === "PROJETADO");
    const ativos = L.filter((l) => l.status !== "CANCELADO");

    /* ---------- 2. parcelas ---------- */
    const pagoPorParcela = new Map(), qtdRealParc = new Map(), qtdProjParc = new Map(),
      dataPagParc = new Map();
    for (const l of L) {
      if (!l.parcelaId) continue;
      if (l.status === "REALIZADO") {
        pagoPorParcela.set(l.parcelaId, (pagoPorParcela.get(l.parcelaId) || 0) + l.valor);
        qtdRealParc.set(l.parcelaId, (qtdRealParc.get(l.parcelaId) || 0) + 1);
        const at = dataPagParc.get(l.parcelaId);
        if (!at || l.data < at) dataPagParc.set(l.parcelaId, l.data);
      } else if (l.status === "PROJETADO") {
        qtdProjParc.set(l.parcelaId, (qtdProjParc.get(l.parcelaId) || 0) + 1);
      }
    }
    const fimMesHoje = Dt.fimMes(hoje);
    const parcelas = d.parcelas.map((p) => {
      const c = idx.cmp.get(p.compromissoId);
      const antes = c && p.num <= (c.pagasAntes || 0);
      const pago = pagoPorParcela.get(p.id) || 0;
      let st;
      if (antes || (qtdRealParc.get(p.id) || 0) > 0) st = "PAGA";
      else if (p.vencimento < hoje) st = "ATRASADA";
      else if (p.vencimento <= fimMesHoje) st = "ABERTA";
      else st = "PROJETADA";
      return { ...p, compromissoNome: c?.nome ?? "?", total: c?.qtd ?? 0,
        rotulo: `${p.num}/${c?.qtd ?? "?"}`, pagoAntes: antes ? "SIM" : "NAO",
        pagoRealizado: pago, dataPagamento: dataPagParc.get(p.id) || "",
        qtdReal: qtdRealParc.get(p.id) || 0, qtdProj: qtdProjParc.get(p.id) || 0,
        status: st, diasAtraso: st === "ATRASADA" ? Dt.diffDias(hoje, p.vencimento) : 0,
        diferenca: st === "PAGA" && !antes ? pago - p.valor : 0 };
    });
    const parcPorCmp = groupBy(parcelas, (p) => p.compromissoId);

    /* ---------- 3. compromissos ---------- */
    const compromissos = d.compromissos.map((c) => {
      const ps = (parcPorCmp.get(c.id) || []).slice().sort((a, b) => a.num - b.num);
      const cont = (s) => ps.filter((p) => p.status === s).length;
      const pagas = cont("PAGA");
      const prox = ps.find((p) => p.status !== "PAGA" && p.status !== "CANCELADA");
      const total = c.qtd * c.valorParcela;
      const valorPago = sum(ps.filter((p) => p.status === "PAGA"), (p) => p.valor);
      return { ...c, valorTotal: total, parcelas: ps, pagas, abertas: cont("ABERTA"),
        atrasadas: cont("ATRASADA"), projetadas: cont("PROJETADA"), restantes: c.qtd - pagas,
        valorPago, devedor: total - valorPago, atual: `${Math.min(c.qtd, pagas + 1)}/${c.qtd}`,
        proximoVencimento: prox?.vencimento || "", entidadeNome: ent.get(c.entidadeId)?.nome ?? "—",
        categoriaNome: idx.cat.get(c.categoriaId)?.nome ?? "" };
    });

    /* ---------- 4. metas e reservas ---------- */
    const reservaMeta = new Map(), reservaConta = new Map();
    for (const m of d.movMetas) {
      const s = (SINAL_MOV[m.tipo] || 0) * m.valor;
      reservaMeta.set(m.metaId, (reservaMeta.get(m.metaId) || 0) + s);
      const meta = idx.meta.get(m.metaId);
      if (meta && meta.contaId) reservaConta.set(meta.contaId, (reservaConta.get(meta.contaId) || 0) + s);
    }
    const metas = d.metas.map((m) => {
      const res = reservaMeta.get(m.id) || 0;
      const falta = Math.max(0, m.objetivo - res);
      const mesesRest = m.prazo ? Math.max(0, Dt.diffMeses(m.prazo, hoje)) : 0;
      let situacao;
      if (m.status === "Cancelada") situacao = "CANCELADA";
      else if (m.status === "Concluída") situacao = "CONCLUÍDA";
      else if (res >= m.objetivo) situacao = "OBJETIVO ATINGIDO";
      else if (m.prazo && m.prazo < hoje) situacao = "PRAZO VENCIDO";
      else if (mesesRest <= 3) situacao = "EM RISCO";
      else situacao = "EM DIA";
      return { ...m, reservado: res, pct: m.objetivo ? res / m.objetivo : 0, faltante: falta,
        mesesRestantes: mesesRest, aporteMensal: mesesRest > 0 ? Math.round(falta / mesesRest) : falta,
        situacao, contaNome: m.contaId ? (idx.conta.get(m.contaId)?.nome ?? "?") : "" };
    });

    /* ---------- 5. contas ---------- */
    const contas = d.contas.map((c) => {
      const eR = sum(R.filter((l) => l.destinoTipo === "CONTA" && l.destinoId === c.id), (l) => l.valor);
      const sR = sum(R.filter((l) => l.origemTipo === "CONTA" && l.origemId === c.id), (l) => l.valor);
      const eP = sum(P.filter((l) => l.destinoTipo === "CONTA" && l.destinoId === c.id), (l) => l.valor);
      const sP = sum(P.filter((l) => l.origemTipo === "CONTA" && l.origemId === c.id), (l) => l.valor);
      const saldo = c.saldoInicial + eR - sR, res = reservaConta.get(c.id) || 0;
      return { ...c, entradas: eR, saidas: sR, saldo, reservado: res, disponivel: saldo - res,
        entradasProj: eP, saidasProj: sP, projetado: saldo + eP - sP,
        instituicaoNome: idx.inst.get(c.instituicaoId)?.nome ?? "" };
    });

    /* ---------- 6. cartoes ---------- */
    const cartoes = d.cartoes.map((k) => {
      const compras = sum(R.filter((l) => l.origemTipo === "CARTAO" && l.origemId === k.id), (l) => l.valor);
      const pagtos = sum(R.filter((l) => l.destinoTipo === "CARTAO" && l.destinoId === k.id), (l) => l.valor);
      const divida = k.dividaInicial + compras - pagtos;
      const { y, m, d: dia } = Dt.parts(hoje);
      const fech = Dt.diaMes(y, m + (dia > k.diaFechamento ? 1 : 0), k.diaFechamento);
      const ini = Dt.addDias(Dt.addMeses(fech, -1), 1);
      const fp = Dt.parts(fech);
      const venc = Dt.diaMes(fp.y, fp.m + (k.diaVencimento > k.diaFechamento ? 0 : 1), k.diaVencimento);
      const noCiclo = (l) => l.origemTipo === "CARTAO" && l.origemId === k.id && l.data >= ini && l.data <= fech;
      const fatura = sum(ativos.filter(noCiclo), (l) => l.valor);
      const futuras = sum(P.filter((l) => l.origemTipo === "CARTAO" && l.origemId === k.id && l.data > fech), (l) => l.valor);
      const parcFut = sum(P.filter((l) => l.origemTipo === "CARTAO" && l.origemId === k.id && l.parcelaId), (l) => l.valor);
      return { ...k, compras, pagamentos: pagtos, divida, pctLimite: k.limite ? divida / k.limite : 0,
        disponivel: k.limite - divida, fechamento: fech, inicioCiclo: ini, vencimento: venc,
        fatura, futuras, parcelasFuturas: parcFut, comprometimento: divida + futuras,
        diasParaVencer: Dt.diffDias(venc, hoje),
        instituicaoNome: idx.inst.get(k.instituicaoId)?.nome ?? "" };
    });

    /* ---------- 7. investimentos ---------- */
    const investimentos = d.investimentos.map((i) => {
      const f = (lista, tipo) => sum(lista.filter((l) => l.destinoTipo === "INVESTIMENTO"
        && l.destinoId === i.id && (!tipo || l.tipo === tipo)), (l) => l.valor);
      const aportes = f(R, "APORTE"), rend = f(R, "RENDIMENTO");
      const resg = sum(R.filter((l) => l.origemTipo === "INVESTIMENTO" && l.origemId === i.id), (l) => l.valor);
      const saldo = i.valorInicial + aportes + rend - resg;
      const principal = Math.max(0, i.valorInicial + aportes - resg);
      const venc = i.prazoMeses > 0 && i.dataInicial ? Dt.addMeses(i.dataInicial, i.prazoMeses) : "";
      const meses = venc ? Math.max(0, Dt.diffMeses(venc, hoje)) : 12;
      let estim = 0;
      if (i.baseRendimento === "Taxa anual") estim = Math.round(saldo * (Math.pow(1 + i.taxa, meses / 12) - 1));
      else if (i.baseRendimento === "Taxa mensal") estim = Math.round(saldo * (Math.pow(1 + i.taxa, meses) - 1));
      else if (i.baseRendimento === "Valor fixo") estim = i.taxa;
      const rendProj = f(P, "RENDIMENTO"), aporteProj = f(P, "APORTE");
      const resgProj = sum(P.filter((l) => l.origemTipo === "INVESTIMENTO" && l.origemId === i.id), (l) => l.valor);
      return { ...i, aportes, resgates: resg, rendimento: rend, saldo, principal,
        rendNoSaldo: saldo - principal, vencimento: venc, mesesAteVenc: meses,
        rendProjetado: rendProj, rendEstimadoTaxa: estim,
        valorEstimado: saldo + rendProj + aporteProj - resgProj,
        aportesProj: aporteProj, resgatesProj: resgProj,
        diasParaVencer: venc ? Dt.diffDias(venc, hoje) : null,
        instituicaoNome: idx.inst.get(i.instituicaoId)?.nome ?? "" };
    });

    /* ---------- 8. fluxo de caixa ---------- */
    const somaPer = (lista, campo, ini, fim) =>
      sum(lista.filter((l) => l.data >= ini && l.data <= fim), (l) => l[campo]);
    const saldoIniTotal = sum(d.contas, (c) => c.saldoInicial);
    const saldoAte = (limiteExcl) => saldoIniTotal
      + sum(ativos.filter((l) => l.data < limiteExcl), (l) => l.entradaCaixa - l.saidaCaixa);
    const baseGrade = d.contas.length
      ? Dt.addDias(Dt.fimMes(d.contas.reduce((a, c) => c.dataSaldoInicial < a ? c.dataSaldoInicial : a,
        d.contas[0].dataSaldoInicial)), 1)
      : Dt.iniMes(hoje);
    const N_MES = 30;
    const reservaFluxo = cfg.reservaNoFluxo === "SIM"
      ? sum(metas.filter((m) => m.considerarFluxo === "SIM" && m.status === "Ativa"), (m) => m.reservado) : 0;
    const fluxo = [];
    let acc = saldoAte(baseGrade);
    for (let i = 0; i < N_MES; i++) {
      const ini = Dt.addMeses(baseGrade, i), fim = Dt.fimMes(ini);
      const eR = somaPer(R, "entradaCaixa", ini, fim), sR = somaPer(R, "saidaCaixa", ini, fim);
      const eP = somaPer(P, "entradaCaixa", ini, fim), sP = somaPer(P, "saidaCaixa", ini, fim);
      const ini_ = acc; acc = acc + eR - sR + eP - sP;
      fluxo.push({ compet: Dt.compet(ini), ini, fim, saldoIni: ini_, entR: eR, saiR: sR,
        entP: eP, saiP: sP, liqR: eR - sR, liqP: eP - sP, saldoFim: acc,
        reservado: reservaFluxo, livre: acc - reservaFluxo });
    }
    const diario = []; let accD = saldoAte(Dt.addDias(hoje, -15));
    for (let i = 0; i < 60; i++) {
      const dia = Dt.addDias(hoje, -15 + i);
      const e = somaPer(ativos, "entradaCaixa", dia, dia), s = somaPer(ativos, "saidaCaixa", dia, dia);
      accD += e - s;
      diario.push({ data: dia, ent: e, sai: s, liq: e - s, saldo: accD,
        futuro: dia > hoje, hoje: dia === hoje });
    }
    const semanal = []; const seg0 = Dt.addDias(Dt.segundaDaSemana(hoje), -14);
    let accS = saldoAte(seg0);
    for (let i = 0; i < 30; i++) {
      const ini = Dt.addDias(seg0, i * 7), fim = Dt.addDias(ini, 6);
      const e = somaPer(ativos, "entradaCaixa", ini, fim), s = somaPer(ativos, "saidaCaixa", ini, fim);
      accS += e - s;
      semanal.push({ ini, fim, ent: e, sai: s, liq: e - s, saldo: accS });
    }
    const anos = []; const anoIni = Dt.parts(baseGrade).y;
    for (let i = 0; i < 6; i++) {
      const a = anoIni + i, ini = a + "-01-01", fim = a + "-12-31";
      anos.push({ ano: a, entR: somaPer(R, "entradaCaixa", ini, fim), saiR: somaPer(R, "saidaCaixa", ini, fim),
        entP: somaPer(P, "entradaCaixa", ini, fim), saiP: somaPer(P, "saidaCaixa", ini, fim),
        saldoFim: saldoAte(Dt.addDias(fim, 1)) });
    }

    /* ---------- 9. projecao ---------- */
    const projecao = []; let accP = saldoAte(Dt.iniMes(hoje));
    for (let i = 0; i < 24; i++) {
      const ini = Dt.addMeses(Dt.iniMes(hoje), i), fim = Dt.fimMes(ini);
      const noPer = (l) => l.data >= ini && l.data <= fim;
      const pr = P.filter(noPer), rr = R.filter(noPer);
      const liqR = sum(rr, (l) => l.entradaCaixa - l.saidaCaixa);
      const liqP = sum(pr, (l) => l.entradaCaixa - l.saidaCaixa);
      accP += liqR + liqP;
      projecao.push({ compet: Dt.compet(ini), ini, fim,
        receitas: sum(pr, (l) => l.vRec), rendimentos: sum(pr, (l) => l.vRend),
        despesas: sum(pr, (l) => l.vDesp),
        parcelas: sum(pr.filter((l) => l.parcelaId), (l) => l.valor),
        faturas: sum(pr.filter((l) => l.tipo === "PAGAMENTO_CARTAO"), (l) => l.valor),
        aportes: sum(pr.filter((l) => l.tipo === "APORTE"), (l) => l.valor),
        resgates: sum(pr.filter((l) => l.tipo === "RESGATE"), (l) => l.valor),
        entradas: sum(pr, (l) => l.entradaCaixa), saidas: sum(pr, (l) => l.saidaCaixa),
        liqR, liqP, saldo: accP });
    }

    /* ---------- 10. patrimonio ---------- */
    const totContas = sum(contas, (c) => c.saldo), totInv = sum(investimentos, (i) => i.saldo);
    const totCart = sum(cartoes, (k) => k.divida), totBens = sum(d.bens, (b) => b.valor);
    const devedorTotal = sum(parcelas.filter((p) => p.status !== "PAGA"), (p) => p.valor);
    const patrimonio = { contas: totContas, investimentos: totInv, bens: totBens,
      cartoes: totCart, compromissos: devedorTotal,
      ativosFin: totContas + totInv, ativos: totContas + totInv + totBens,
      passivos: totCart + devedorTotal,
      plFin: totContas + totInv - totCart - devedorTotal,
      plTotal: totContas + totInv + totBens - totCart - devedorTotal,
      reservado: sum(metas, (m) => m.reservado), livre: sum(contas, (c) => c.disponivel) };
    const evolucao = [];
    for (let i = 0; i < N_MES; i++) {
      const fim = Dt.fimMes(Dt.addMeses(baseGrade, i));
      const ate = ativos.filter((l) => l.data <= fim);
      const ct = saldoIniTotal + sum(ate, (l) => l.efConta);
      const iv = sum(d.investimentos, (x) => x.valorInicial) + sum(ate, (l) => l.efInv);
      const kt = sum(d.cartoes, (x) => x.dividaInicial) + sum(ate, (l) => l.efCartao);
      const dv = sum(parcelas.filter((p) => p.vencimento > fim
        || (p.vencimento <= fim && p.status === "ATRASADA")), (p) => p.valor);
      const plF = ct + iv - kt - dv;
      evolucao.push({ compet: Dt.compet(fim), fim, contas: ct, investimentos: iv, bens: totBens,
        cartoes: kt, compromissos: dv, plFin: plF, plTotal: plF + totBens });
    }
    evolucao.forEach((e, i) => { e.variacao = i ? e.plTotal - evolucao[i - 1].plTotal : 0; });

    return { dRaw: d, cfg, hoje, idx, ent, L, R, P, ativos, contas, cartoes, investimentos, metas,
      parcelas, compromissos, fluxo, diario, semanal, anos, projecao, patrimonio, evolucao,
      reservaFluxo, baseGrade, saldoAte, somaPer,
      indicadores: null, alertas: null, testes: null };
  },

  validarLanc(l, idx, ent) {
    if (!(l.valor > 0)) return "Valor deve ser maior que zero";
    if (!CLASSIF[l.tipo]) return "Tipo de operação inválido";
    if (!STATUS_LANC.includes(l.status)) return "Status inválido";
    if (l.origemTipo === "EXTERNO" && l.destinoTipo === "EXTERNO") return "Origem e destino externos";
    if (l.origemTipo !== "EXTERNO") {
      const e = ent.get(l.origemId);
      if (!e || e.tipo !== l.origemTipo) return "Origem inexistente";
    }
    if (l.destinoTipo !== "EXTERNO") {
      const e = ent.get(l.destinoId);
      if (!e || e.tipo !== l.destinoTipo) return "Destino inexistente";
    }
    if (l.categoriaId && !idx.cat.has(l.categoriaId)) return "Categoria inexistente";
    if (l.subcategoriaId) {
      const s = idx.sub.get(l.subcategoriaId);
      if (!s) return "Subcategoria inexistente";
      if (l.categoriaId && s.categoriaId !== l.categoriaId) return "Subcategoria não pertence à categoria";
    }
    if (l.parcelaId && !idx.parc.has(l.parcelaId)) return "Parcela inexistente";
    if (l.compromissoId && !idx.cmp.has(l.compromissoId)) return "Compromisso inexistente";
    return "OK";
  },
};
</script>
<script>
"use strict";
/* ==================================================================== */
/*  INDICADORES, ALERTAS E BATERIA DE TESTES                             */
/* ==================================================================== */
Calc.indicadores = function (v) {
  const { hoje, cfg, R, P, contas, cartoes, investimentos, metas, parcelas,
    projecao, patrimonio, evolucao } = v;
  const per = (lista, campo, ini, fim) =>
    sum(lista.filter((l) => l.data >= ini && l.data <= fim), (l) => l[campo]);
  const ini6 = Dt.addMeses(hoje, -6), iniMes = Dt.iniMes(hoje), fimMes = Dt.fimMes(hoje);
  const recMedia = per(R, "vRec", ini6, hoje) / 6;
  const despMedia = per(R, "vDesp", ini6, Dt.addDias(iniMes, -1)) / 6;
  const despMes = per(R, "vDesp", iniMes, fimMes);
  const recMes = per(R, "vRec", iniMes, fimMes), rendMes = per(R, "vRend", iniMes, fimMes);
  const desp6 = per(R, "vDesp", ini6, hoje) / 6;
  const lim12 = Dt.addMeses(hoje, 12);
  const compr12 = sum(P.filter((l) => l.data > hoje && l.data <= lim12
    && (l.parcelaId || l.tipo === "PAGAMENTO_CARTAO")), (l) => l.valor);
  /* gastos por categoria no mes e no ano */
  const porCat = (lista, ini, fim) => {
    const m = new Map();
    for (const l of lista) if (l.data >= ini && l.data <= fim && l.vDesp)
      m.set(l.categoriaNome || "Sem categoria", (m.get(l.categoriaNome || "Sem categoria") || 0) + l.vDesp);
    return Array.from(m, ([nome, valor]) => ({ nome, valor })).sort((a, b) => b.valor - a.valor);
  };
  const catMes = porCat(R, iniMes, fimMes);
  const catAno = porCat([...R, ...P], Dt.iniAno(hoje), Dt.fimAno(hoje));
  const menorProj = projecao.reduce((a, p) => (p.saldo < a.saldo ? p : a), projecao[0] || { saldo: 0 });
  const maiorSaida = projecao.reduce((a, p) => (p.saidas > a.saidas ? p : a), projecao[0] || { saidas: 0 });
  const evHoje = evolucao.find((e) => e.compet === Dt.compet(hoje));
  const ev6 = evolucao.find((e) => e.compet === Dt.compet(Dt.addMeses(hoje, -6)));
  const varPat = (evHoje?.plTotal ?? 0) - (ev6?.plTotal ?? 0);
  return {
    recMedia, despMedia, despMes, recMes, rendMes, desp6,
    variacaoDesp: despMedia ? despMes / despMedia - 1 : 0,
    taxaPoupanca: recMedia ? 1 - desp6 / recMedia : 0,
    compr12, pctRenda: recMedia ? compr12 / (recMedia * 12) : 0,
    parcelasAbertas: sum(parcelas.filter((p) => p.status !== "PAGA"), (p) => p.valor),
    catMes, catAno, maiorCatMes: catMes[0] || null, maiorCatAno: catAno[0] || null,
    menorProj, maiorSaida, varPat,
    tendencia: varPat > 0 ? "CRESCENTE" : varPat < 0 ? "DECRESCENTE" : "ESTÁVEL",
    investVencendo: investimentos.filter((i) => i.diasParaVencer !== null
      && i.diasParaVencer >= 0 && i.diasParaVencer <= cfg.diasInv),
    metasQuase: metas.filter((m) => m.status === "Ativa" && m.pct >= 0.8),
    metasAtivas: metas.filter((m) => m.status === "Ativa"),
    resultadoMes: recMes + rendMes - despMes,
  };
};

Calc.alertas = function (v) {
  const { cfg, hoje, contas, cartoes, investimentos, metas, parcelas, L, projecao, fluxo } = v;
  const ind = v.indicadores, a = [];
  const add = (grupo, titulo, detalhe, valor, nivel) => a.push({ grupo, titulo, detalhe, valor, nivel });
  for (const c of contas.filter((c) => c.status !== "Encerrado"))
    if (c.disponivel < cfg.saldoMin)
      add("Contas", c.nome, `Disponível abaixo do mínimo de ${Fmt.gs(cfg.saldoMin)}`, c.disponivel, "grave");
  for (const k of cartoes.filter((k) => k.status !== "Encerrado")) {
    if (k.pctLimite >= cfg.pctCartao)
      add("Cartões", k.nome, `Uso do limite em ${Fmt.pct(k.pctLimite)}`, k.divida, "grave");
    if (k.diasParaVencer >= 0 && k.diasParaVencer <= cfg.diasAlerta)
      add("Cartões", k.nome, `Fatura vence em ${k.diasParaVencer} dia(s), em ${Fmt.data(k.vencimento)}`, k.fatura, "aviso");
  }
  const atras = parcelas.filter((p) => p.status === "ATRASADA");
  if (atras.length) add("Parcelas", `${atras.length} parcela(s) atrasada(s)`,
    atras.slice(0, 3).map((p) => `${p.compromissoNome} ${p.rotulo}`).join(" · ")
    + (atras.length > 3 ? " …" : ""), sum(atras, (p) => p.valor), "grave");
  const vencendo = parcelas.filter((p) => p.status === "ABERTA"
    && Dt.diffDias(p.vencimento, hoje) <= cfg.diasAlerta && p.vencimento >= hoje);
  if (vencendo.length) add("Parcelas", `${vencendo.length} parcela(s) vencendo em até ${cfg.diasAlerta} dias`,
    vencendo.slice(0, 3).map((p) => `${p.compromissoNome} ${p.rotulo} em ${Fmt.data(p.vencimento)}`).join(" · "),
    sum(vencendo, (p) => p.valor), "aviso");
  for (const i of ind.investVencendo)
    add("Investimentos", i.nome, `Vence em ${i.diasParaVencer} dia(s), em ${Fmt.data(i.vencimento)}`, i.saldo, "aviso");
  for (const m of metas.filter((m) => m.situacao === "PRAZO VENCIDO" || m.situacao === "EM RISCO"))
    add("Metas", m.nome, `${m.situacao.toLowerCase()} — ${Fmt.pct(m.pct)} concluído, faltam ${Fmt.gs(m.faltante)}`,
      m.faltante, m.situacao === "PRAZO VENCIDO" ? "grave" : "aviso");
  if (ind.menorProj && ind.menorProj.saldo < 0)
    add("Fluxo", "Saldo projetado fica negativo", `Menor saldo em ${Fmt.compet(ind.menorProj.compet)}`,
      ind.menorProj.saldo, "grave");
  if (ind.pctRenda > cfg.pctRenda)
    add("Fluxo", "Renda muito comprometida",
      `${Fmt.pct(ind.pctRenda)} da renda dos próximos 12 meses já está comprometida (limite ${Fmt.pct(cfg.pctRenda)})`,
      ind.compr12, "aviso");
  if (ind.variacaoDesp > cfg.pctDesp && ind.despMedia > 0)
    add("Fluxo", "Despesa acima do padrão",
      `${Fmt.pct(ind.variacaoDesp)} acima da média dos 6 meses anteriores`, ind.despMes, "aviso");
  const erros = L.filter((l) => l.validacao !== "OK");
  if (erros.length) add("Integridade", `${erros.length} lançamento(s) com erro`,
    erros.slice(0, 3).map((l) => `${l.descricao}: ${l.validacao}`).join(" · "), null, "grave");
  const dup = parcelas.filter((p) => p.qtdReal > 1);
  if (dup.length) add("Integridade", `${dup.length} parcela(s) com pagamento duplicado`,
    dup.map((p) => `${p.compromissoNome} ${p.rotulo}`).join(" · "), null, "grave");
  const pend = parcelas.filter((p) => p.qtdReal > 0 && p.qtdProj > 0);
  if (pend.length) add("Integridade", `${pend.length} parcela(s) paga(s) com lançamento projetado sobrando`,
    pend.map((p) => `${p.compromissoNome} ${p.rotulo}`).join(" · "), null, "aviso");
  return a;
};

Calc.testes = function (v) {
  const { d, L, R, P, contas, cartoes, investimentos, metas, parcelas, compromissos,
    patrimonio, fluxo, projecao, hoje } = v;
  const t = [], TOL = 0.5;
  const add = (grupo, nome, esperado, obtido, unidade) =>
    t.push({ grupo, nome, esperado, obtido, dif: (obtido || 0) - (esperado || 0),
      ok: Math.abs((obtido || 0) - (esperado || 0)) <= TOL, unidade: unidade || "gs" });
  const somaSe = (lista, f, campo) => sum(lista.filter(f), (l) => l[campo]);

  for (const c of contas) add("Saldo de conta", `Saldo inicial + entradas − saídas: ${c.nome}`,
    c.saldoInicial + somaSe(R, (l) => l.destinoTipo === "CONTA" && l.destinoId === c.id, "valor")
      - somaSe(R, (l) => l.origemTipo === "CONTA" && l.origemId === c.id, "valor"), c.saldo);
  for (const k of cartoes) add("Dívida de cartão", `Dívida inicial + compras − pagamentos: ${k.nome}`,
    k.dividaInicial + somaSe(R, (l) => l.origemTipo === "CARTAO" && l.origemId === k.id, "valor")
      - somaSe(R, (l) => l.destinoTipo === "CARTAO" && l.destinoId === k.id, "valor"), k.divida);
  for (const i of investimentos) {
    add("Investimento", `Aplicado + aportes + rendimentos − resgates: ${i.nome}`,
      i.valorInicial + somaSe(R, (l) => l.destinoTipo === "INVESTIMENTO" && l.destinoId === i.id, "valor")
        - somaSe(R, (l) => l.origemTipo === "INVESTIMENTO" && l.origemId === i.id, "valor"), i.saldo);
    add("Investimento", `Principal + rendimento = saldo: ${i.nome}`, i.saldo, i.principal + i.rendNoSaldo);
  }
  for (const m of metas) add("Meta", `Reservas − retiradas = acumulado: ${m.nome}`,
    sum(v.dRaw.movMetas.filter((x) => x.metaId === m.id), (x) => (SINAL_MOV[x.tipo] || 0) * x.valor),
    m.reservado);
  for (const c of compromissos) add("Compromisso", `Pago + devedor = total: ${c.nome}`,
    c.valorTotal, c.valorPago + c.devedor);

  add("Integridade", "Transferência não vira receita", 0, sum(L.filter((l) => l.tipo === "TRANSFERENCIA"), (l) => l.vRec));
  add("Integridade", "Transferência não vira despesa", 0, sum(L.filter((l) => l.tipo === "TRANSFERENCIA"), (l) => l.vDesp));
  add("Integridade", "Aporte não é despesa", 0, sum(L.filter((l) => l.tipo === "APORTE"), (l) => l.vDesp));
  add("Integridade", "Resgate não é receita", 0, sum(L.filter((l) => l.tipo === "RESGATE"), (l) => l.vRec));
  add("Integridade", "Pagamento de fatura não é despesa", 0, sum(L.filter((l) => l.tipo === "PAGAMENTO_CARTAO"), (l) => l.vDesp));
  add("Integridade", "Compra no cartão é integralmente despesa",
    sum(L.filter((l) => l.tipo === "COMPRA_CARTAO"), (l) => l.valor),
    sum(L.filter((l) => l.tipo === "COMPRA_CARTAO"), (l) => l.vDesp));
  add("Integridade", "Rendimento é integralmente receita financeira",
    sum(L.filter((l) => l.tipo === "RENDIMENTO"), (l) => l.valor),
    sum(L.filter((l) => l.tipo === "RENDIMENTO"), (l) => l.vRend));
  add("Integridade", "Transferência entre contas fica fora do fluxo de caixa", 0,
    sum(L.filter((l) => l.origemTipo === "CONTA" && l.destinoTipo === "CONTA"),
      (l) => l.entradaCaixa + l.saidaCaixa));
  add("Realizado x projetado", "Saldo das contas usa apenas lançamentos realizados",
    sum(contas, (c) => c.saldoInicial) + sum(R, (l) => l.efConta), sum(contas, (c) => c.saldo));
  add("Realizado x projetado", "Saldo projetado = realizado + projetados",
    sum(contas, (c) => c.saldo) + sum(P, (l) => l.efConta), sum(contas, (c) => c.projetado));
  add("Realizado x projetado", "Todo lançamento tem status válido", sum(L, (l) => l.valor),
    sum(L.filter((l) => STATUS_LANC.includes(l.status)), (l) => l.valor));
  add("Patrimônio", "Ativos − passivos = patrimônio líquido total",
    patrimonio.ativos - patrimonio.passivos, patrimonio.plTotal);
  add("Patrimônio", "Patrimônio financeiro = total − bens",
    patrimonio.plTotal - patrimonio.bens, patrimonio.plFin);
  add("Metas", "Reserva de meta não altera o saldo físico da conta",
    sum(contas, (c) => c.saldoInicial) + sum(R, (l) => l.efConta), sum(contas, (c) => c.saldo));
  add("Metas", "Disponível = saldo − reservado",
    sum(contas, (c) => c.saldo) - sum(contas, (c) => c.reservado), sum(contas, (c) => c.disponivel));
  add("Metas", "Meta cancelada ou concluída fica com reserva zerada", 0,
    sum(metas.filter((m) => m.status === "Cancelada" || m.status === "Concluída"), (m) => m.reservado));
  add("Parcelas", "Soma dos status = total de parcelas", parcelas.length,
    parcelas.filter((p) => ["PAGA", "ABERTA", "ATRASADA", "PROJETADA", "CANCELADA"]
      .includes(p.status)).length, "qtd");
  add("Parcelas", "Nenhuma parcela com mais de um pagamento realizado", 0,
    parcelas.filter((p) => p.qtdReal > 1).length, "qtd");
  add("Parcelas", "Nenhuma parcela paga mantém lançamento projetado", 0,
    parcelas.filter((p) => p.qtdReal > 0 && p.qtdProj > 0).length, "qtd");
  add("Duplicidade", "Nenhum ID de lançamento repetido", L.length, new Set(L.map((l) => l.id)).size, "qtd");
  add("Duplicidade", "Nenhum ID de parcela repetido", parcelas.length,
    new Set(parcelas.map((p) => p.id)).size, "qtd");
  add("Duplicidade", "Nenhum lançamento com erro de validação", 0,
    L.filter((l) => l.validacao !== "OK").length, "qtd");
  if (fluxo.length) {
    add("Fluxo de caixa", "Saldo final da grade = saldo projetado das contas",
      sum(contas, (c) => c.projetado), fluxo[fluxo.length - 1].saldoFim);
    add("Fluxo de caixa", "Entradas realizadas da grade = entradas dos lançamentos",
      sum(R.filter((l) => l.data >= fluxo[0].ini), (l) => l.entradaCaixa),
      sum(fluxo, (f) => f.entR));
  }
  if (projecao.length) add("Projeção", "Último mês projetado = saldo projetado das contas",
    sum(contas, (c) => c.projetado), projecao[projecao.length - 1].saldo);
  return t;
};
</script>
<script>
"use strict";
/* ==================================================================== */
/*  COMPONENTES E GRAFICOS                                               */
/* ==================================================================== */
const SERIES = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)"];

const UI = {
  card(titulo, corpo, extra = "", flush = false) {
    return `<section class="card">${titulo ? `<div class="card-h"><h3>${esc(titulo)}</h3><div class="sp"></div>${extra}</div>` : ""}<div class="card-b${flush ? " flush" : ""}">${corpo}</div></section>`;
  },
  kpi(label, valor, sub = "", mod = "") {
    return `<div class="kpi ${mod}"><div class="k-l">${esc(label)}</div>
      <div class="k-v">${esc(valor)}</div>${sub ? `<div class="k-s">${sub}</div>` : ""}</div>`;
  },
  vazio(titulo, msg, botao = "") {
    return `<div class="empty"><strong>${esc(titulo)}</strong>${esc(msg)}${botao ? `<div style="margin-top:12px">${botao}</div>` : ""}</div>`;
  },
  /** Emite a mesma lista duas vezes: tabela (telas largas) e cartoes (telefone).
   *  O papel de cada coluna no cartao e deduzido: a primeira vira titulo, colunas
   *  sem cabecalho viram acoes, celulas com etiqueta viram selo, a primeira coluna
   *  numerica vira o valor em destaque e o resto vira par rotulo/valor. */
  tabela(cols, linhas, opts = {}) {
    if (!linhas.length) return UI.vazio(opts.vazioTitulo || "Nada por aqui ainda",
      opts.vazioMsg || "Cadastre o primeiro registro para começar.", opts.vazioBotao || "");
    const papel = cols.map((c, i) => {
      if (c.m) return c.m;
      if (!c.t) return "acao";
      if (i === 0) return "titulo";
      return c.num ? "num" : "texto";
    });
    const iValor = papel.findIndex((p, i) => p === "num" && cols[i].destaque !== false);
    const th = cols.map((c) => `<th class="${c.num ? "num" : ""}">${esc(c.t)}</th>`).join("");
    let tr = "", cards = "";
    for (const l of linhas) {
      const vals = cols.map((c) => c.f(l));
      tr += `<tr${l._attr || ""}>` + cols.map((c, i) =>
        `<td class="${c.num ? "num" : ""}${c.cls ? " " + c.cls(l) : ""}">${vals[i]}</td>`).join("") + "</tr>";
      const selos = [], pares = [], acoes = [];
      let titulo = "", valor = "";
      cols.forEach((c, i) => {
        const v = vals[i];
        if (papel[i] === "acao") { if (String(v).trim()) acoes.push(v); return; }
        if (papel[i] === "titulo") { titulo = v; return; }
        if (i === iValor) { valor = v; return; }
        if (/class="tag /.test(String(v))) { selos.push(v); return; }
        const txt = String(v).replace(/<[^>]*>/g, "").trim();
        if (txt && txt !== "—" && txt !== "0") pares.push(`<div><dt>${esc(c.t)}</dt><dd>${v}</dd></div>`);
      });
      cards += `<article class="cardrow"><div class="cr-top"><div class="cr-t">${titulo}</div>
        ${valor ? `<div class="cr-v">${valor}</div>` : ""}</div>
        ${selos.length ? `<div class="cr-badges">${selos.join("")}</div>` : ""}
        ${pares.length ? `<dl class="cr-grid">${pares.join("")}</dl>` : ""}
        ${acoes.length ? `<div class="cr-acts">${acoes.join("")}</div>` : ""}</article>`;
    }
    const tf = opts.rodape ? `<tfoot class="tfoot"><tr>` + cols.map((c) =>
      `<td class="${c.num ? "num" : ""}">${opts.rodape[c.k] ?? ""}</td>`).join("") + "</tr></tfoot>" : "";
    return `<div class="tbl-wrap"><table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody>${tf}</table></div>
      <div class="cards">${cards}</div>`;
  },
  tag(texto, nivel) { return `<span class="tag t-${nivel}"><i class="dot"></i>${esc(texto)}</span>`; },
  tagStatus(s) {
    const m = { REALIZADO: "bom", PROJETADO: "aviso", CANCELADO: "neutro", PAGA: "bom",
      ABERTA: "aviso", ATRASADA: "grave", PROJETADA: "neutro", CANCELADA: "neutro",
      Ativo: "bom", Ativa: "bom", Inativo: "neutro", Encerrado: "neutro",
      "Concluída": "acc", Cancelada: "neutro", Pausada: "neutro",
      "EM DIA": "bom", "EM RISCO": "aviso", "PRAZO VENCIDO": "grave",
      "OBJETIVO ATINGIDO": "acc", "CONCLUÍDA": "acc", CANCELADA: "neutro" };
    return UI.tag(s, m[s] || "neutro");
  },
  moeda(n, opts = {}) {
    const cls = n < 0 ? "neg" : (opts.positivo && n > 0 ? "pos" : "");
    return `<span class="${cls}">${esc(Fmt.gs(n, opts.sinal))}</span>`;
  },
  progresso(pct) {
    return `<div class="bar" title="${Fmt.pct(pct)}"><i style="width:${clamp(pct * 100, 0, 100).toFixed(1)}%"></i></div>`;
  },
  opcoes(lista, sel, vazio) {
    const o = lista.map((x) => {
      const v = typeof x === "string" ? x : x.v, t = typeof x === "string" ? x : x.t;
      return `<option value="${esc(v)}"${String(v) === String(sel) ? " selected" : ""}>${esc(t)}</option>`;
    }).join("");
    return (vazio ? `<option value=""${!sel ? " selected" : ""}>${esc(vazio)}</option>` : "") + o;
  },
  campo(label, inner, full) {
    return `<div class="field${full ? " full" : ""}"><label>${esc(label)}</label>${inner}</div>`;
  },
  sel(nome, label, lista, sel, opts = {}) {
    return UI.campo(label, `<select class="inp" name="${nome}"${opts.attr || ""}>${UI.opcoes(lista, sel, opts.vazio)}</select>`, opts.full);
  },
  txt(nome, label, valor, opts = {}) {
    return UI.campo(label, `<input class="inp" name="${nome}" type="${opts.tipo || "text"}" value="${esc(valor ?? "")}"${opts.attr || ""}>`, opts.full);
  },
  legenda(itens) {
    return `<div class="lgd">` + itens.map((i, n) =>
      `<span><i style="background:${i.cor || SERIES[n % 6]}"></i>${esc(i.nome)}</span>`).join("") + `</div>`;
  },
};

/* ------------------------------------------------------------ graficos */
const Chart = {
  /** barras verticais agrupadas; series = [{nome, cor, val(d)}] */
  barras(dados, series, opts = {}) {
    if (!dados.length) return UI.vazio("Sem dados no período", "Registre lançamentos para ver o gráfico.");
    const W = 720, H = opts.altura || 260, PL = 62, PR = 10, PT = 14, PB = 26;
    const vals = dados.flatMap((d) => series.map((s) => s.val(d)));
    const max = Math.max(1, ...vals), min = Math.min(0, ...vals), span = max - min || 1;
    const iw = W - PL - PR, ih = H - PT - PB;
    const bw = iw / dados.length, gw = bw * 0.68, sw = gw / series.length;
    const y = (v) => PT + ih - ((v - min) / span) * ih;
    const passo = Math.max(1, Math.ceil(dados.length / 14));
    let g = "";
    for (const t of new Set([min, min + span / 2, max].map((x) => Math.round(x))))
      g += `<line x1="${PL}" x2="${W - PR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
        <text x="${PL - 8}" y="${(y(t) + 4).toFixed(1)}" font-size="11" text-anchor="end" fill="var(--ink-3)">${esc(Fmt.gsCurto(t))}</text>`;
    let b = "";
    dados.forEach((d, i) => {
      series.forEach((s, j) => {
        const v = s.val(d), x = PL + i * bw + (bw - gw) / 2 + j * sw;
        const y0 = y(Math.max(0, v)), y1 = y(Math.min(0, v));
        const h = Math.max(Math.abs(y1 - y0), v ? 2 : 0);
        if (!h) return;
        b += `<rect x="${(x + 1).toFixed(1)}" y="${y0.toFixed(1)}" width="${Math.max(2, sw - 2).toFixed(1)}"
          height="${h.toFixed(1)}" rx="2" fill="${s.cor || SERIES[j % 6]}"><title>${esc(opts.rot(d))} · ${esc(s.nome)}: ${esc(Fmt.gs(Math.abs(v)))}</title></rect>`;
      });
      if (i % passo === 0)
        b += `<text x="${(PL + i * bw + bw / 2).toFixed(1)}" y="${H - 8}" font-size="11"
          text-anchor="middle" fill="var(--ink-3)">${esc(opts.rot(d))}</text>`;
    });
    return `${UI.legenda(series)}<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"
      role="img" aria-label="${esc(opts.aria || "gráfico de barras")}">${g}
      <line x1="${PL}" x2="${W - PR}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="var(--line-2)" stroke-width="1.5"/>
      ${b}</svg>`;
  },

  /** area + linha com destaque no ultimo ponto */
  area(dados, valor, opts = {}) {
    if (dados.length < 2) return UI.vazio("Sem dados suficientes", "São necessários ao menos dois períodos.");
    const W = 720, H = opts.altura || 240, PL = 62, PR = 14, PT = 14, PB = 26;
    const vs = dados.map(valor);
    const max = Math.max(...vs, 0), min = Math.min(...vs, 0), span = (max - min) || 1;
    const iw = W - PL - PR, ih = H - PT - PB;
    const X = (i) => PL + (i / (dados.length - 1)) * iw;
    const Y = (v) => PT + ih - ((v - min) / span) * ih;
    const pts = vs.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    const base = Y(Math.max(0, min)).toFixed(1);
    const passo = Math.max(1, Math.ceil(dados.length / 12));
    let g = "";
    for (const t of new Set([min, min + span / 2, max].map((x) => Math.round(x))))
      g += `<line x1="${PL}" x2="${W - PR}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
        <text x="${PL - 8}" y="${(Y(t) + 4).toFixed(1)}" font-size="11" text-anchor="end" fill="var(--ink-3)">${esc(Fmt.gsCurto(t))}</text>`;
    let marks = "";
    dados.forEach((d, i) => {
      const ultimo = i === dados.length - 1;
      marks += `<circle cx="${X(i).toFixed(1)}" cy="${Y(vs[i]).toFixed(1)}" r="${ultimo ? 5 : 3.2}"
        fill="${ultimo ? "var(--accent)" : "var(--surface)"}" stroke="var(--accent)" stroke-width="2">
        <title>${esc(opts.rot(d))}: ${esc(Fmt.gs(vs[i]))}</title></circle>`;
      if (i % passo === 0 || ultimo)
        marks += `<text x="${X(i).toFixed(1)}" y="${H - 8}" font-size="11" text-anchor="middle" fill="var(--ink-3)">${esc(opts.rot(d))}</text>`;
    });
    const zero = min < 0 ? `<line x1="${PL}" x2="${W - PR}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}"
      stroke="var(--grave)" stroke-width="1.5" stroke-dasharray="5 4"/>` : "";
    const ult = `<text x="${(W - PR).toFixed(1)}" y="${(Y(vs[vs.length - 1]) - 10).toFixed(1)}" font-size="12"
      font-weight="700" text-anchor="end" fill="var(--accent)">${esc(Fmt.gsCurto(vs[vs.length - 1]))}</text>`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img"
      aria-label="${esc(opts.aria || "evolução")}">${g}${zero}
      <polygon points="${PL},${base} ${pts} ${X(dados.length - 1).toFixed(1)},${base}" fill="var(--accent)" opacity=".12"/>
      <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${marks}${ult}</svg>`;
  },

  /** barras horizontais com rotulo direto - ideal para ranking de categorias */
  ranking(itens, opts = {}) {
    if (!itens.length) return UI.vazio("Sem gastos no período", "Nada foi classificado neste período.");
    const max = Math.max(...itens.map((i) => Math.abs(i.valor))) || 1;
    return `<div class="list-lines">` + itens.slice(0, opts.limite || 8).map((i, n) => `
      <div class="line-item">
        <span class="dot" style="background:${SERIES[n % 6]};width:9px;height:9px;border-radius:2px"></span>
        <div class="li-m"><b>${esc(i.nome)}</b>
          <div class="bar" style="margin-top:4px"><i style="width:${(Math.abs(i.valor) / max * 100).toFixed(1)}%;background:${SERIES[n % 6]}"></i></div>
        </div>
        <span class="mono" style="font-size:12.5px;font-weight:600">${esc(Fmt.gs(i.valor))}</span>
      </div>`).join("") + `</div>`;
  },
};
</script>
<script>
"use strict";
/* ==================================================================== */
/*  TELAS                                                                */
/* ==================================================================== */
const btnNovo = (tipo, rot) => `<button class="btn btn-pri btn-sm" data-act="novo" data-tipo="${tipo}">+ ${esc(rot)}</button>`;
const acoes = (tipo, id) => `<button class="btn btn-sm" data-act="editar" data-tipo="${tipo}" data-id="${esc(id)}">Editar</button>
  <button class="btn btn-sm btn-danger" data-act="excluir" data-tipo="${tipo}" data-id="${esc(id)}">Excluir</button>`;

const Views = {};

/* ------------------------------------------------------------- painel */
Views.painel = (v) => {
  const i = v.indicadores, p = v.patrimonio;
  const graves = v.alertas.filter((a) => a.nivel === "grave").length;
  const fluxo12 = v.fluxo.filter((f) => f.compet >= Dt.compet(Dt.addMeses(v.hoje, -6))
    && f.compet <= Dt.compet(Dt.addMeses(v.hoje, 5)));
  const kpis = [
    UI.kpi("Saldo total das contas", Fmt.gs(p.contas), `${v.contas.length} conta(s)`, "lead"),
    UI.kpi("Disponível (não reservado)", Fmt.gs(p.livre), `${Fmt.gs(p.reservado)} reservado em metas`),
    UI.kpi("Total investido", Fmt.gs(p.investimentos), `${Fmt.gs(sum(v.investimentos, (x) => x.rendimento))} de rendimento realizado`),
    UI.kpi("Patrimônio líquido", Fmt.gs(p.plTotal), `Financeiro: ${Fmt.gs(p.plFin)}`, p.plTotal >= 0 ? "good" : "bad"),
    UI.kpi("Dívida de cartões", Fmt.gs(p.cartoes), `${Fmt.gs(sum(v.cartoes, (k) => k.disponivel))} de limite livre`),
    UI.kpi("Devedor de compromissos", Fmt.gs(p.compromissos), `${v.parcelas.filter((x) => x.status !== "PAGA").length} parcela(s) a vencer`),
    UI.kpi("Resultado do mês", Fmt.gs(i.resultadoMes), `${Fmt.gs(i.recMes + i.rendMes)} entrou · ${Fmt.gs(i.despMes)} saiu`,
      i.resultadoMes >= 0 ? "good" : "bad"),
    UI.kpi("Menor saldo projetado", Fmt.gs(i.menorProj?.saldo ?? 0),
      i.menorProj ? "em " + Fmt.compet(i.menorProj.compet) : "", (i.menorProj?.saldo ?? 0) < 0 ? "bad" : ""),
  ].join("");
  const alertaTopo = graves
    ? `<div class="aviso-box e"><b>${graves} alerta(s) exigem atenção.</b>
        ${esc(v.alertas.filter((a) => a.nivel === "grave").slice(0, 2).map((a) => a.titulo).join(" · "))}
        <button class="btn btn-sm" style="margin-left:8px" data-act="ir" data-rota="alertas">Ver alertas</button></div>` : "";
  return `<div class="page-head"><div><h1>Painel</h1>
      <p>Posição em ${Fmt.data(v.hoje)}. Valores realizados, salvo onde estiver escrito projetado.</p></div></div>
    ${Guia.card(v)}
    ${alertaTopo}
    <div class="grid g4">${kpis}</div>
    <div class="split">
      ${UI.card("Entradas e saídas por mês", Chart.barras(fluxo12, [
        { nome: "Entradas", val: (f) => f.entR + f.entP, cor: "var(--s2)" },
        { nome: "Saídas", val: (f) => -(f.saiR + f.saiP), cor: "var(--s4)" },
      ], { rot: (f) => MESES_C[Number(String(f.compet).slice(4)) - 1], aria: "entradas e saídas por mês" }),
        `<span class="hint">realizado + projetado</span>`)}
      ${UI.card("Onde o dinheiro foi neste mês", Chart.ranking(i.catMes, { limite: 7 }),
        `<span class="hint">${Fmt.mesAno(v.hoje)}</span>`)}
    </div>
    <div class="split">
      ${UI.card("Saldo projetado", Chart.area(v.projecao.slice(0, 15), (p) => p.saldo,
        { rot: (p) => MESES_C[Number(String(p.compet).slice(4)) - 1], aria: "saldo projetado" }),
        `<span class="hint">próximos 15 meses</span>`)}
      ${UI.card("Contas", UI.tabela([
        { t: "Conta", f: (c) => `<b>${esc(c.nome)}</b><br><span class="hint">${esc(c.tipo)}</span>` },
        { t: "Saldo", num: true, f: (c) => UI.moeda(c.saldo) },
        { t: "Disponível", num: true, f: (c) => UI.moeda(c.disponivel) },
      ], v.contas, { vazioTitulo: "Nenhuma conta cadastrada", vazioMsg: "Comece cadastrando onde seu dinheiro está.",
        vazioBotao: `<button class="btn btn-pri" data-act="ir" data-rota="contas">Cadastrar conta</button>` }), "", true)}
    </div>
    <div class="split">
      ${UI.card("Metas", v.metas.length ? `<div class="list-lines">` + v.metas.map((m) => `
        <div class="line-item"><div class="li-m"><b>${esc(m.nome)}</b>
          <span>${esc(Fmt.gs(m.reservado))} de ${esc(Fmt.gs(m.objetivo))} · ${esc(Fmt.pct(m.pct))}</span>
          <div style="margin-top:5px">${UI.progresso(m.pct)}</div></div>
          ${UI.tagStatus(m.situacao)}</div>`).join("") + `</div>`
        : UI.vazio("Nenhuma meta", "Crie uma meta para reservar dinheiro sem tirá-lo da conta."), "", false)}
      ${UI.card("Próximos compromissos", UI.tabela([
        { t: "Compromisso", f: (c) => `<b>${esc(c.nome)}</b><br><span class="hint">parcela ${esc(c.atual)}</span>` },
        { t: "Vence", f: (c) => esc(Fmt.data(c.proximoVencimento)) },
        { t: "Devedor", num: true, f: (c) => UI.moeda(c.devedor) },
      ], v.compromissos.filter((c) => c.restantes > 0),
        { vazioTitulo: "Nenhum parcelamento", vazioMsg: "Cadastre financiamentos e compras parceladas." }), "", true)}
    </div>`;
};

/* -------------------------------------------------------- lancamentos */
Views.lancamentos = (v) => {
  const f = App.filtros;
  const lista = App.lancamentosFiltrados(v);
  const tot = { rec: sum(lista, (l) => l.vRec), desp: sum(lista, (l) => l.vDesp),
    rend: sum(lista, (l) => l.vRend), ent: sum(lista, (l) => l.entradaCaixa),
    sai: sum(lista, (l) => l.saidaCaixa) };
  const optConta = [...v.contas.map((c) => ({ v: c.id, t: c.nome })),
    ...v.cartoes.map((c) => ({ v: c.id, t: c.nome })), ...v.investimentos.map((c) => ({ v: c.id, t: c.nome }))];
  const filtros = `<div class="row" style="gap:8px">
    <input class="inp" style="width:190px" placeholder="Buscar descrição…" name="q" value="${esc(f.q)}" data-filtro="q">
    <select class="inp" style="width:140px" data-filtro="status">${UI.opcoes(STATUS_LANC, f.status, "Todos os status")}</select>
    <select class="inp" style="width:165px" data-filtro="tipo">${UI.opcoes(TIPOS_OP.map((t) => ({ v: t, t: ROTULO_OP[t] })), f.tipo, "Todos os tipos")}</select>
    <select class="inp" style="width:165px" data-filtro="entidade">${UI.opcoes(optConta, f.entidade, "Conta/cartão: todos")}</select>
    <select class="inp" style="width:160px" data-filtro="categoria">${UI.opcoes(v.dRaw.categorias.map((c) => ({ v: c.id, t: c.nome })), f.categoria, "Todas as categorias")}</select>
    <input class="inp" style="width:135px" type="month" data-filtro="mes" value="${esc(f.mes)}">
    <button class="btn btn-sm" data-act="limpar-filtros">Limpar</button></div>`;
  return `<div class="page-head"><div><h1>Lançamentos</h1>
      <p>O livro único do sistema. Toda operação tem uma origem e um destino — é daí que saem todos os cálculos.</p></div>
    <div class="sp" style="flex:1"></div>${btnNovo("lancamento", "Novo lançamento")}</div>
    <div class="grid g4">
      ${UI.kpi("Receitas", Fmt.gs(tot.rec), "no filtro atual")}
      ${UI.kpi("Despesas", Fmt.gs(tot.desp), "no filtro atual")}
      ${UI.kpi("Entradas de caixa", Fmt.gs(tot.ent), "")}
      ${UI.kpi("Saídas de caixa", Fmt.gs(tot.sai), "")}
    </div>
    ${UI.card("", UI.tabela([
      { t: "Data", f: (l) => `<span class="mono">${esc(Fmt.data(l.data))}</span>` },
      { t: "Descrição", f: (l) => `<b>${esc(l.descricao)}</b>
          ${l.validacao !== "OK" ? `<br><span class="tag t-grave">${esc(l.validacao)}</span>` : ""}
          ${l.vinculos.length ? `<br><span class="hint">vinculado: ${esc(l.vinculos.join(" · "))}</span>` : ""}` },
      { t: "Tipo", f: (l) => esc(ROTULO_OP[l.tipo] || l.tipo) },
      { t: "De → Para", f: (l) => `<span class="hint">${esc(l.origemNome)} → ${esc(l.destinoNome)}</span>` },
      { t: "Categoria", f: (l) => esc(l.categoriaNome ? l.categoriaNome + (l.subcategoriaNome ? " · " + l.subcategoriaNome : "") : "—") },
      { t: "Status", f: (l) => UI.tagStatus(l.status) },
      { t: "Valor", num: true, f: (l) => UI.moeda(l.classificacao === "DESPESA" ? -l.valor : l.valor) },
      { t: "", f: (l) => `<div class="row" style="gap:4px">
          ${l.status === "PROJETADO" ? `<button class="btn btn-sm" data-act="realizar" data-id="${esc(l.id)}">Realizar</button>` : ""}
          ${l.status !== "CANCELADO" ? `<button class="btn btn-sm" data-act="cancelar-lanc" data-id="${esc(l.id)}">Cancelar</button>`
            : `<button class="btn btn-sm" data-act="reativar" data-id="${esc(l.id)}">Reativar</button>`}
          ${acoes("lancamento", l.id)}</div>` },
    ], lista.slice(0, 400), { vazioTitulo: "Nenhum lançamento", vazioMsg: "Registre a primeira operação.",
      vazioBotao: btnNovo("lancamento", "Novo lançamento") }), filtros, true)}
    ${lista.length > 400 ? `<p class="hint">Mostrando os 400 primeiros de ${lista.length}. Use os filtros para reduzir.</p>` : ""}`;
};

/* ------------------------------------------------------------- contas */
Views.contas = (v) => `
  <div class="page-head"><div><h1>Contas</h1>
    <p>Contas bancárias e dinheiro em espécie. O saldo é sempre saldo inicial mais entradas menos saídas realizadas.</p></div>
  <div style="flex:1"></div>${btnNovo("conta", "Nova conta")}</div>
  <div class="grid g4">
    ${UI.kpi("Saldo total", Fmt.gs(sum(v.contas, (c) => c.saldo)))}
    ${UI.kpi("Reservado em metas", Fmt.gs(sum(v.contas, (c) => c.reservado)))}
    ${UI.kpi("Disponível", Fmt.gs(sum(v.contas, (c) => c.disponivel)))}
    ${UI.kpi("Projetado", Fmt.gs(sum(v.contas, (c) => c.projetado)), "com lançamentos futuros")}
  </div>
  ${UI.card("", UI.tabela([
    { t: "Conta", f: (c) => `<b>${esc(c.nome)}</b><br><span class="hint">${esc(c.instituicaoNome || "—")} · ${esc(c.tipo)}</span>` },
    { t: "Saldo inicial", num: true, f: (c) => UI.moeda(c.saldoInicial) },
    { t: "Entradas", num: true, f: (c) => UI.moeda(c.entradas) },
    { t: "Saídas", num: true, f: (c) => UI.moeda(-c.saidas) },
    { t: "Saldo", num: true, f: (c) => `<b>${UI.moeda(c.saldo)}</b>` },
    { t: "Reservado", num: true, f: (c) => UI.moeda(c.reservado) },
    { t: "Disponível", num: true, f: (c) => UI.moeda(c.disponivel) },
    { t: "Projetado", num: true, f: (c) => UI.moeda(c.projetado) },
    { t: "Status", f: (c) => UI.tagStatus(c.status) },
    { t: "", f: (c) => acoes("conta", c.id) },
  ], v.contas, { vazioTitulo: "Nenhuma conta", vazioMsg: "Cadastre onde seu dinheiro fica guardado.",
    vazioBotao: btnNovo("conta", "Nova conta") }), "", true)}`;

/* ------------------------------------------------------------ cartoes */
Views.cartoes = (v) => `
  <div class="page-head"><div><h1>Cartões de crédito</h1>
    <p>A compra no cartão já é a despesa. O pagamento da fatura só tira dinheiro da conta e abate a dívida — nunca gera uma segunda despesa.</p></div>
  <div style="flex:1"></div>${btnNovo("cartao", "Novo cartão")}</div>
  <div class="grid g4">
    ${UI.kpi("Dívida total", Fmt.gs(sum(v.cartoes, (k) => k.divida)))}
    ${UI.kpi("Limite disponível", Fmt.gs(sum(v.cartoes, (k) => k.disponivel)))}
    ${UI.kpi("Fatura do ciclo aberto", Fmt.gs(sum(v.cartoes, (k) => k.fatura)))}
    ${UI.kpi("Comprometimento futuro", Fmt.gs(sum(v.cartoes, (k) => k.comprometimento)), "dívida + compras já lançadas")}
  </div>
  ${UI.card("", UI.tabela([
    { t: "Cartão", f: (k) => `<b>${esc(k.nome)}</b><br><span class="hint">${esc(k.instituicaoNome || "—")} · fecha dia ${k.diaFechamento}, vence dia ${k.diaVencimento}</span>` },
    { t: "Limite", num: true, f: (k) => UI.moeda(k.limite) },
    { t: "Dívida", num: true, f: (k) => `<b>${UI.moeda(k.divida)}</b>` },
    { t: "Uso", num: true, f: (k) => `${Fmt.pct(k.pctLimite)}<div style="margin-top:3px">${UI.progresso(k.pctLimite)}</div>` },
    { t: "Disponível", num: true, f: (k) => UI.moeda(k.disponivel) },
    { t: "Ciclo aberto", f: (k) => `<span class="hint">${esc(Fmt.data(k.inicioCiclo))} a ${esc(Fmt.data(k.fechamento))}</span>` },
    { t: "Fatura", num: true, f: (k) => UI.moeda(k.fatura) },
    { t: "Vence em", f: (k) => `${esc(Fmt.data(k.vencimento))}<br><span class="hint">${k.diasParaVencer} dia(s)</span>` },
    { t: "", f: (k) => acoes("cartao", k.id) },
  ], v.cartoes, { vazioTitulo: "Nenhum cartão", vazioMsg: "Cadastre seus cartões para controlar faturas e limite.",
    vazioBotao: btnNovo("cartao", "Novo cartão") }), "", true)}`;

/* ------------------------------------------------------ investimentos */
Views.investimentos = (v) => `
  <div class="page-head"><div><h1>Investimentos</h1>
    <p>Cada investimento é um caixa separado. Aporte e resgate movem dinheiro sem virar despesa nem receita; só o rendimento é receita financeira.</p></div>
  <div style="flex:1"></div>${btnNovo("investimento", "Novo investimento")}</div>
  <div class="grid g4">
    ${UI.kpi("Total investido", Fmt.gs(sum(v.investimentos, (i) => i.saldo)))}
    ${UI.kpi("Principal", Fmt.gs(sum(v.investimentos, (i) => i.principal)))}
    ${UI.kpi("Rendimento realizado", Fmt.gs(sum(v.investimentos, (i) => i.rendimento)), "já creditado", "good")}
    ${UI.kpi("Rendimento projetado", Fmt.gs(sum(v.investimentos, (i) => i.rendProjetado)), "estimativa, nunca somada ao realizado")}
  </div>
  ${UI.card("", UI.tabela([
    { t: "Investimento", f: (i) => `<b>${esc(i.nome)}</b><br><span class="hint">${esc(i.instituicaoNome || "—")} · ${esc(i.tipo)}</span>` },
    { t: "Saldo", num: true, f: (i) => `<b>${UI.moeda(i.saldo)}</b>` },
    { t: "Principal", num: true, f: (i) => UI.moeda(i.principal) },
    { t: "Rend. no saldo", num: true, f: (i) => UI.moeda(i.rendNoSaldo) },
    { t: "Rend. realizado", num: true, f: (i) => UI.moeda(i.rendimento) },
    { t: "Rend. projetado", num: true, f: (i) => UI.moeda(i.rendProjetado) },
    { t: "Taxa", num: true, f: (i) => `${Fmt.pct(i.taxa, 2)}<br><span class="hint">${esc(i.baseRendimento)}</span>` },
    { t: "Vencimento", f: (i) => i.vencimento ? `${esc(Fmt.data(i.vencimento))}<br><span class="hint">${i.diasParaVencer} dia(s)</span>` : "<span class='hint'>sem prazo</span>" },
    { t: "", f: (i) => `<button class="btn btn-sm" data-act="resgatar" data-id="${esc(i.id)}">Resgatar</button>${acoes("investimento", i.id)}` },
  ], v.investimentos, { vazioTitulo: "Nenhum investimento", vazioMsg: "Cadastre fondos mutuos, ahorro a plazo e outros.",
    vazioBotao: btnNovo("investimento", "Novo investimento") }), "", true)}`;
</script>
<script>
"use strict";
/* ------------------------------------------------------ compromissos */
Views.compromissos = (v) => {
  const cor = { PAGA: "bom", ABERTA: "aviso", ATRASADA: "grave", PROJETADA: "neutro", CANCELADA: "neutro" };
  const blocos = v.compromissos.map((c) => {
    const aberto = App.abertos.has(c.id);
    const linhas = aberto ? UI.tabela([
      { t: "Parcela", f: (p) => `<b class="mono">${esc(p.rotulo)}</b>` },
      { t: "Vencimento", f: (p) => esc(Fmt.data(p.vencimento)) },
      { t: "Valor", num: true, f: (p) => UI.moeda(p.valor) },
      { t: "Status", f: (p) => UI.tag(p.status, cor[p.status] || "neutro") },
      { t: "Pago em", f: (p) => p.dataPagamento ? esc(Fmt.data(p.dataPagamento))
        : (p.pagoAntes === "SIM" ? "<span class='hint'>antes do sistema</span>" : "—") },
      { t: "Atraso", num: true, f: (p) => p.diasAtraso ? `<span class="neg">${p.diasAtraso} dia(s)</span>` : "—" },
      { t: "", f: (p) => p.status === "PAGA" ? "" :
        `<button class="btn btn-sm btn-pri" data-act="pagar-parcela" data-id="${esc(p.id)}">Registrar pagamento</button>` },
    ], c.parcelas) : "";
    return `<section class="card">
      <div class="card-h">
        <h3>${esc(c.nome)}</h3>
        ${UI.tag("parcela " + c.atual, "acc")}
        ${c.atrasadas ? UI.tag(c.atrasadas + " atrasada(s)", "grave") : ""}
        <div class="sp"></div>
        <span class="hint">${esc(c.categoriaNome)} · paga em ${esc(c.entidadeNome)}</span>
        <button class="btn btn-sm" data-act="toggle" data-id="${esc(c.id)}">${aberto ? "Ocultar" : "Ver"} cronograma</button>
        ${acoes("compromisso", c.id)}
      </div>
      <div class="card-b">
        <div class="grid g4">
          ${UI.kpi("Valor total", Fmt.gs(c.valorTotal), `${c.qtd} parcelas de ${Fmt.gs(c.valorParcela)}`)}
          ${UI.kpi("Já pago", Fmt.gs(c.valorPago), `${c.pagas} de ${c.qtd} parcelas`, "good")}
          ${UI.kpi("Saldo devedor", Fmt.gs(c.devedor), `${c.restantes} parcela(s) restante(s)`)}
          ${UI.kpi("Próximo vencimento", c.proximoVencimento ? Fmt.data(c.proximoVencimento) : "—",
            c.proximoVencimento ? Dt.diffDias(c.proximoVencimento, v.hoje) + " dia(s)" : "quitado")}
        </div>
        <div style="margin-top:12px">${UI.progresso(c.qtd ? c.pagas / c.qtd : 0)}</div>
      </div>
      ${aberto ? `<div class="card-b flush" style="border-top:1px solid var(--line)">${linhas}</div>` : ""}
    </section>`;
  }).join("");
  return `<div class="page-head"><div><h1>Compromissos e parcelas</h1>
      <p>Financiamentos e compras parceladas. Informe quantas parcelas já foram quitadas antes de começar a usar o sistema e o cronograma inteiro é gerado.</p></div>
    <div style="flex:1"></div>${btnNovo("compromisso", "Novo compromisso")}</div>
    ${v.compromissos.length ? blocos : UI.card("", UI.vazio("Nenhum compromisso",
      "Cadastre um financiamento ou uma compra parcelada e o cronograma sai pronto.",
      btnNovo("compromisso", "Novo compromisso")))}`;
};

/* -------------------------------------------------------------- metas */
Views.metas = (v) => {
  const movs = v.dRaw.movMetas.slice().sort((a, b) => b.data.localeCompare(a.data));
  const nomeMeta = (id) => v.metas.find((m) => m.id === id)?.nome ?? id;
  return `<div class="page-head"><div><h1>Metas</h1>
      <p>A meta é uma reserva lógica: o dinheiro continua na conta, mas sai do saldo disponível. Nada aqui altera seu saldo bancário.</p></div>
    <div style="flex:1"></div>${btnNovo("meta", "Nova meta")}</div>
    <div class="grid g3">
      ${UI.kpi("Metas ativas", String(v.metas.filter((m) => m.status === "Ativa").length))}
      ${UI.kpi("Total reservado", Fmt.gs(sum(v.metas, (m) => m.reservado)))}
      ${UI.kpi("Falta acumular", Fmt.gs(sum(v.metas.filter((m) => m.status === "Ativa"), (m) => m.faltante)))}
    </div>
    <div class="grid g2">${v.metas.map((m) => `
      <section class="card"><div class="card-h"><h3>${esc(m.nome)}</h3><div class="sp"></div>${UI.tagStatus(m.situacao)}</div>
        <div class="card-b">
          <div class="row" style="justify-content:space-between;margin-bottom:6px">
            <span class="mono" style="font-size:19px;font-weight:600">${esc(Fmt.gs(m.reservado))}</span>
            <span class="hint">de ${esc(Fmt.gs(m.objetivo))} · ${esc(Fmt.pct(m.pct))}</span></div>
          ${UI.progresso(m.pct)}
          <div class="grid g3" style="margin-top:12px">
            ${UI.kpi("Falta", Fmt.gs(m.faltante))}
            ${UI.kpi("Prazo", m.prazo ? Fmt.data(m.prazo) : "—", m.mesesRestantes + " mês(es)")}
            ${UI.kpi("Aporte mensal", Fmt.gs(m.aporteMensal), "para chegar no prazo")}
          </div>
          <p class="hint" style="margin-top:10px">Reserva na conta: ${esc(m.contaNome || "não vinculada")} ·
            ${m.considerarFluxo === "SIM" ? "descontada" : "não descontada"} do fluxo projetado</p>
          <div class="row" style="margin-top:12px">
            <button class="btn btn-pri btn-sm" data-act="mov-meta" data-id="${esc(m.id)}" data-mov="RESERVA">Reservar</button>
            <button class="btn btn-sm" data-act="mov-meta" data-id="${esc(m.id)}" data-mov="RETIRADA">Retirar</button>
            <button class="btn btn-sm" data-act="mov-meta" data-id="${esc(m.id)}" data-mov="TRANSF_SAIDA">Transferir</button>
            ${m.status === "Ativa" ? `<button class="btn btn-sm" data-act="concluir-meta" data-id="${esc(m.id)}">Concluir</button>
              <button class="btn btn-sm btn-danger" data-act="cancelar-meta" data-id="${esc(m.id)}">Cancelar</button>` : ""}
            ${acoes("meta", m.id)}
          </div>
        </div></section>`).join("") || UI.card("", UI.vazio("Nenhuma meta",
          "Crie uma meta para separar dinheiro sem tirá-lo da conta.", btnNovo("meta", "Nova meta")))}
    </div>
    ${UI.card("Histórico de movimentações", UI.tabela([
      { t: "Data", f: (m) => esc(Fmt.data(m.data)) },
      { t: "Meta", f: (m) => esc(nomeMeta(m.metaId)) },
      { t: "Movimento", f: (m) => UI.tag(m.tipo.replace(/_/g, " "), SINAL_MOV[m.tipo] > 0 ? "bom" : "aviso") },
      { t: "Valor", num: true, f: (m) => UI.moeda((SINAL_MOV[m.tipo] || 0) * m.valor, { sinal: true, positivo: true }) },
      { t: "Destino", f: (m) => esc(m.destino || (m.metaDestinoId ? nomeMeta(m.metaDestinoId) : "—")) },
      { t: "Observação", f: (m) => `<span class="hint">${esc(m.obs || "")}</span>` },
      { t: "", f: (m) => `<button class="btn btn-sm btn-danger" data-act="excluir" data-tipo="movMeta" data-id="${esc(m.id)}">Excluir</button>` },
    ], movs, { vazioTitulo: "Sem movimentações", vazioMsg: "As reservas e retiradas aparecem aqui." }), "", true)}`;
};

/* ------------------------------------------------------- recorrencias */
Views.recorrencias = (v) => `
  <div class="page-head"><div><h1>Recorrências</h1>
    <p>Regras que se repetem: salário, aluguel, assinaturas. Gere as ocorrências como lançamentos projetados e marque como realizado quando o dinheiro se mover.</p></div>
  <div style="flex:1"></div>${btnNovo("recorrencia", "Nova recorrência")}</div>
  ${UI.card("", UI.tabela([
    { t: "Descrição", f: (r) => `<b>${esc(r.descricao)}</b><br><span class="hint">${esc(ROTULO_OP[r.tipo] || r.tipo)}</span>` },
    { t: "Valor", num: true, f: (r) => UI.moeda(r.valor) },
    { t: "Periodicidade", f: (r) => `${esc(r.periodicidade)}<br><span class="hint">dia ${r.dia}</span>` },
    { t: "Início", f: (r) => esc(Fmt.data(r.inicio)) },
    { t: "Ocorrências", num: true, f: (r) => String(r.ocorrencias) },

    { t: "Status", f: (r) => UI.tagStatus(r.status) },
    { t: "", f: (r) => `<button class="btn btn-sm btn-pri" data-act="gerar-rec" data-id="${esc(r.id)}">Gerar lançamentos</button>${acoes("recorrencia", r.id)}` },
  ], v.dRaw.recorrencias, { vazioTitulo: "Nenhuma recorrência",
    vazioMsg: "Cadastre o que se repete todo mês e deixe o sistema projetar.",
    vazioBotao: btnNovo("recorrencia", "Nova recorrência") }), "", true)}`;

/* ---------------------------------------------------------- catalogos */
Views.categorias = (v) => {
  const subs = groupBy(v.dRaw.subcategorias, (s) => s.categoriaId);
  const gastoCat = new Map();
  for (const l of v.L) if (l.vDesp) gastoCat.set(l.categoriaId, (gastoCat.get(l.categoriaId) || 0) + l.vDesp);
  return `<div class="page-head"><div><h1>Categorias</h1>
      <p>Como suas despesas e receitas são classificadas. As subcategorias aparecem automaticamente na tela de lançamento conforme a categoria escolhida.</p></div>
    <div style="flex:1"></div>${btnNovo("subcategoria", "Nova subcategoria")}${btnNovo("categoria", "Nova categoria")}</div>
    <div class="grid g2">${v.dRaw.categorias.map((c) => `
      <section class="card"><div class="card-h"><h3>${esc(c.nome)}</h3>
        ${UI.tag(c.tipoPadrao, c.tipoPadrao === "RECEITA" ? "bom" : c.tipoPadrao === "NEUTRO" ? "neutro" : "aviso")}
        <div class="sp"></div><span class="mono hint">${esc(Fmt.gs(gastoCat.get(c.id) || 0))}</span>
        ${acoes("categoria", c.id)}</div>
        <div class="card-b"><div class="row" style="gap:6px">
          ${(subs.get(c.id) || []).map((s) => `<span class="tag t-neutro">${esc(s.nome)}
            <button class="btn btn-sm" style="padding:0 4px;border:0;background:none" data-act="excluir"
              data-tipo="subcategoria" data-id="${esc(s.id)}" title="Excluir subcategoria">×</button></span>`).join("")
            || `<span class="hint">Nenhuma subcategoria.</span>`}
        </div></div></section>`).join("")}</div>`;
};

Views.instituicoes = (v) => `
  <div class="page-head"><div><h1>Instituições</h1>
    <p>Bancos, financeiras e emissores. Depois de cadastrados aparecem nas listas de contas, cartões e investimentos.</p></div>
  <div style="flex:1"></div>${btnNovo("instituicao", "Nova instituição")}</div>
  ${UI.card("", UI.tabela([
    { t: "Nome", f: (i) => `<b>${esc(i.nome)}</b>` },
    { t: "Tipo", f: (i) => esc(i.tipo || "—") },
    { t: "Contas", num: true, f: (i) => String(v.contas.filter((c) => c.instituicaoId === i.id).length) },
    { t: "Cartões", num: true, f: (i) => String(v.cartoes.filter((c) => c.instituicaoId === i.id).length) },

    { t: "Observação", f: (i) => `<span class="hint">${esc(i.obs || "")}</span>` },
    { t: "", f: (i) => acoes("instituicao", i.id) },
