<title>Caja Guaraní</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F3F2F8; --surface:#FFFFFF; --surface-2:#FAFAFD; --surface-3:#F0EEF7;
  --line:#E3E1ED; --line-2:#CDCADE;
  --ink:#1A1826; --ink-2:#565273; --ink-3:#87839F;
  --accent:#4B3F8F; --accent-2:#6152C4; --accent-soft:#EBE9F7; --accent-ink:#FFFFFF;
  --bom:#1F7A4D; --bom-soft:#E3F1E9;
  --aviso:#8F6200; --aviso-soft:#FAF0D9;
  --grave:#A8322A; --grave-soft:#F9E6E4;
  --s1:#5B4BB8; --s2:#0E8C77; --s3:#C4711A; --s4:#B0446E; --s5:#3E7FC1; --s6:#7E8E1F;
  --sh-1:0 1px 2px rgba(26,24,38,.06);
  --sh-2:0 8px 24px -12px rgba(26,24,38,.28);
  --r:10px; --r-sm:6px;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#111019; --surface:#191826; --surface-2:#1F1E2E; --surface-3:#262439;
  --line:#2E2C42; --line-2:#413E5C;
  --ink:#EDEBF5; --ink-2:#A8A4C2; --ink-3:#7A7699;
  --accent:#9186E8; --accent-2:#A79CF2; --accent-soft:#262340; --accent-ink:#12111C;
  --bom:#4FB280; --bom-soft:#16281F;
  --aviso:#D6A63F; --aviso-soft:#2A2415;
  --grave:#E1786E; --grave-soft:#2E1A18;
  --s1:#8B7EE6; --s2:#17A188; --s3:#C87A26; --s4:#CC5580; --s5:#4189C9; --s6:#8B9A22;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 8px 24px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#111019; --surface:#191826; --surface-2:#1F1E2E; --surface-3:#262439;
  --line:#2E2C42; --line-2:#413E5C;
  --ink:#EDEBF5; --ink-2:#A8A4C2; --ink-3:#7A7699;
  --accent:#9186E8; --accent-2:#A79CF2; --accent-soft:#262340; --accent-ink:#12111C;
  --bom:#4FB280; --bom-soft:#16281F;
  --aviso:#D6A63F; --aviso-soft:#2A2415;
  --grave:#E1786E; --grave-soft:#2E1A18;
  --s1:#8B7EE6; --s2:#17A188; --s3:#C87A26; --s4:#CC5580; --s5:#4189C9; --s6:#8B9A22;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 8px 24px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.brand{padding:16px 16px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;letter-spacing:-.04em}
.brand-name{font-weight:800;font-size:15px;letter-spacing:-.03em;line-height:1.1}
.brand-sub{font-size:10.5px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.nav{overflow-y:auto;padding:10px 8px 20px;flex:1}
.nav-group{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 10px;
  border-radius:var(--r-sm);border:0;background:none;cursor:pointer;color:var(--ink-2);
  font-size:13.5px;font-weight:500}
.nav-item:hover{background:var(--surface-3);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .ico{width:16px;text-align:center;flex:none;opacity:.85}
.nav-badge{margin-left:auto;background:var(--grave);color:#fff;border-radius:20px;
  padding:0 6px;font-size:10.5px;font-weight:700;min-width:18px;text-align:center}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding:10px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.topbar .sp{flex:1}
.page{padding:22px;display:flex;flex-direction:column;gap:18px;max-width:1500px;width:100%}
.page-head{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.page-head h1{font-size:23px}
.page-head p{margin:2px 0 0;color:var(--ink-2);font-size:13px;max-width:70ch}
/* ---------- telefone ---------- */
.only-mob{display:none}
.mob-bar,.fab,.sheet-wrap{display:none}

/* folha inferior (menu "mais") */
.sheet-wrap{position:fixed;inset:0;z-index:120;background:rgba(16,14,26,.5);display:none;
  align-items:flex-end}
.sheet-wrap.on{display:flex}
.sheet{background:var(--surface);width:100%;border-radius:16px 16px 0 0;max-height:82vh;
  overflow-y:auto;padding:8px 0 calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:10px 16px 8px}
.sheet-h h3{font-size:15px;flex:1}
.sheet-grip{width:38px;height:4px;border-radius:4px;background:var(--line-2);margin:6px auto 2px}
.sheet-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;
  padding:12px 16px;font-size:14.5px;color:var(--ink);cursor:pointer;text-align:left;min-height:48px}
.sheet-item:hover,.sheet-item:focus{background:var(--surface-3)}
.sheet-item[aria-current="page"]{color:var(--accent);font-weight:700;background:var(--accent-soft)}
.sheet-item .si{width:22px;text-align:center;opacity:.8}
.sheet-sec{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;padding:12px 16px 4px}

/* lista em cartoes (telefone) */
.cards{display:none;flex-direction:column;gap:8px;padding:12px}
@media (max-width:860px){.tbl-wrap{display:none}.cards{display:flex}}
.cardrow{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:11px 12px}
.cr-top{display:flex;gap:10px;align-items:flex-start}
.cr-t{flex:1;min-width:0;font-size:13.5px;font-weight:600;line-height:1.3}
.cr-t .hint{font-weight:400}
.cr-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;
  white-space:nowrap;text-align:right}
.cr-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.cr-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:9px 0 0;padding:9px 0 0;
  border-top:1px dashed var(--line)}
.cr-grid>div{min-width:0}
.cr-grid dt{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.cr-grid dd{margin:1px 0 0;font-size:12.5px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.cr-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cr-acts .row{width:100%;gap:6px}
.cr-acts .btn{flex:1 1 auto;justify-content:center;min-width:88px}

/* guia de primeiros passos */
.guia{border:1px solid var(--accent);border-radius:var(--r);background:var(--accent-soft);overflow:hidden}
.guia-h{padding:13px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.guia-h h3{font-size:14.5px;color:var(--accent)}
.guia-h .sp{flex:1}
.guia-b{background:var(--surface);border-top:1px solid var(--line);padding:4px 0}
.passo{display:flex;gap:11px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid var(--line)}
.passo:last-child{border-bottom:0}
.passo .pn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-size:11.5px;font-weight:700;background:var(--surface-3);color:var(--ink-2);margin-top:1px}
.passo.ok .pn{background:var(--bom);color:#fff}
.passo.ok .pt b{text-decoration:line-through;opacity:.6}
.passo .pt{flex:1;min-width:0}
.passo .pt b{display:block;font-size:13.5px}
.passo .pt span{font-size:12.5px;color:var(--ink-2);display:block;margin-top:1px}
.passo .pa{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
@media (max-width:860px){.passo{flex-wrap:wrap}}

/* ajuda */
.ajuda-sec{margin:0 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);font-weight:700}
.ajuda-p{margin:0 0 14px;max-width:66ch;font-size:13.5px}
.ajuda-lig{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.ajuda-lig button{display:flex;gap:9px;align-items:baseline;text-align:left;width:100%;border:1px solid var(--line);
  background:var(--surface-2);border-radius:var(--r-sm);padding:9px 11px;cursor:pointer;font-size:13px}
.ajuda-lig button:hover{border-color:var(--accent);background:var(--accent-soft)}
.ajuda-lig b{color:var(--accent);white-space:nowrap}
.ajuda-prob{display:flex;flex-direction:column;gap:9px}
.ajuda-prob div{border-left:3px solid var(--aviso);padding:2px 0 2px 11px}
.ajuda-prob b{display:block;font-size:13px}
.ajuda-prob span{font-size:12.5px;color:var(--ink-2)}

/* ---------- primitivas ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-h h3{font-size:14px;letter-spacing:-.01em}
.card-h .sp{flex:1}
.card-b{padding:16px}
.card-b.flush{padding:0}
.hint{color:var(--ink-3);font-size:12px;margin:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(206px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--r-sm);
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;
  font-size:13px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn-pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-danger{color:var(--grave);border-color:var(--grave)}
.btn-danger:hover{background:var(--grave-soft)}
.btn-sm{padding:4px 9px;font-size:12px;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font-size:11px;font-weight:700;color:var(--ink-2);letter-spacing:.03em}
.inp{padding:7px 9px;border:1px solid var(--line-2);border-radius:var(--r-sm);
  background:var(--surface);width:100%;min-width:0}
.inp:disabled{background:var(--surface-3);color:var(--ink-3)}
select.inp{cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;
  font-size:11px;font-weight:700;letter-spacing:.02em;border:1px solid transparent;white-space:nowrap}
.t-bom{background:var(--bom-soft);color:var(--bom)}
.t-aviso{background:var(--aviso-soft);color:var(--aviso)}
.t-grave{background:var(--grave-soft);color:var(--grave)}
.t-neutro{background:var(--surface-3);color:var(--ink-2)}
.t-acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
  background:var(--surface-2);position:sticky;top:0;z-index:1}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td .row{flex-wrap:nowrap}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
th.num{text-align:right}
.tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line-2)}
.neg{color:var(--grave)}
.pos{color:var(--bom)}
.empty{padding:34px 18px;text-align:center;color:var(--ink-3)}
.empty strong{display:block;color:var(--ink-2);margin-bottom:4px;font-size:14px}

/* KPI */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;
  display:flex;flex-direction:column;gap:3px;box-shadow:var(--sh-1)}
.kpi .k-l{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700;min-height:24px}
.kpi .k-v{font-family:var(--mono);font-size:17px;font-weight:600;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-s{font-size:11.5px;color:var(--ink-2)}
.kpi.lead{border-left:3px solid var(--accent)}
.kpi.warn{border-left:3px solid var(--aviso)}
.kpi.bad{border-left:3px solid var(--grave)}
.kpi.good{border-left:3px solid var(--bom)}

/* barra de progresso */
.bar{height:7px;border-radius:20px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:20px;background:var(--accent)}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(16,14,26,.55);display:grid;place-items:center;
  z-index:100;padding:16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--sh-2);width:min(860px,100%);
  max-height:92vh;display:flex;flex-direction:column;border:1px solid var(--line)}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal-h h3{font-size:15px}
.modal-b{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;
  flex-wrap:wrap;background:var(--surface-2);border-radius:0 0 12px 12px}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.fgrid .full{grid-column:1/-1}
.aviso-box{padding:9px 12px;border-radius:var(--r-sm);font-size:12.5px;border:1px solid}
.aviso-box.a{background:var(--aviso-soft);border-color:var(--aviso);color:var(--aviso)}
.aviso-box.e{background:var(--grave-soft);border-color:var(--grave);color:var(--grave)}
.aviso-box.i{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* toast */
.toasts{position:fixed;bottom:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:var(--ground);padding:10px 14px;border-radius:var(--r-sm);
  box-shadow:var(--sh-2);font-size:13px;font-weight:500;max-width:340px}
.toast.err{background:var(--grave);color:#fff}

/* onboarding */
.onb{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--ground)}
.onb-card{width:min(720px,100%);background:var(--surface);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--sh-2);overflow:hidden}
.onb-top{padding:26px 28px 20px;border-bottom:1px solid var(--line)}
.onb-top h1{font-size:26px;letter-spacing:-.03em}
.onb-top p{color:var(--ink-2);margin:6px 0 0;max-width:56ch}
.onb-b{padding:22px 28px 26px;display:flex;flex-direction:column;gap:14px}
.choice{display:flex;gap:13px;align-items:flex-start;padding:14px;border:1px solid var(--line-2);
  border-radius:var(--r);cursor:pointer;background:var(--surface);text-align:left;width:100%}
.choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice .ci{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:var(--accent-soft);color:var(--accent);font-size:17px}
.choice b{display:block;font-size:14.5px}
.choice span{color:var(--ink-2);font-size:12.5px}
.perfil-lista{display:flex;flex-direction:column;gap:8px}
.perfil-item{display:flex;gap:10px;align-items:center;padding:10px 13px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--surface-2)}
.perfil-item b{flex:1}

/* graficos */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--sans);fill:var(--ink-2)}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);padding:0 2px 4px}
.lgd i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;cursor:pointer;font-size:12.5px;
  font-weight:600;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.split{display:grid;gap:14px;grid-template-columns:1.6fr 1fr}
@media (max-width:1050px){.split{grid-template-columns:1fr}}
.list-lines{display:flex;flex-direction:column}
.line-item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.line-item:last-child{border-bottom:0}
.line-item .li-m{flex:1;min-width:0}
.line-item .li-m b{display:block;font-size:13px;font-weight:600}
.line-item .li-m span{font-size:11.5px;color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- ajustes de telefone (por ultimo, para vencer o cascade) ---------- */
@media (max-width:860px){
  .only-mob{display:initial}
  .no-mob{display:none!important}
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
  .topbar{padding:8px 12px;gap:8px}
  .page{padding:12px;gap:14px}
  .page-head h1{font-size:20px}
  .page-head p{font-size:12.5px}
  .grid{gap:10px}
  .g2,.g3{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .kpi{padding:10px 12px}
  .kpi .k-v{font-size:16px}
  .kpi .k-l{min-height:0;font-size:9.5px}
  .split{grid-template-columns:1fr}
  .card-h{padding:11px 13px}
  .card-b{padding:13px}
  .inp,select.inp{font-size:16px;padding:9px 10px}   /* 16px evita o zoom do iOS */
  .btn{padding:9px 14px;min-height:40px}
  .btn-sm{padding:7px 11px;min-height:36px;font-size:12.5px}
  .modal{width:100%;max-height:100vh;height:100%;border-radius:0;border:0}
  .ovl{padding:0;place-items:stretch}
  .modal-f{border-radius:0;padding-bottom:calc(13px + env(safe-area-inset-bottom,0px))}
  .fgrid{grid-template-columns:1fr}
  .onb{padding:0;place-items:stretch}
  .onb-card{border-radius:0;border:0;min-height:100vh}

<script>
"use strict";
/* =====================================================================
   Caja Guaraní - controle financeiro pessoal em Guaraníes
   Mesmo modelo do sistema Excel V1: um livro unico de lancamentos com
   origem e destino, do qual derivam saldos, dividas, parcelas, metas,
   fluxo, projecao, patrimonio, indicadores e alertas.
   ===================================================================== */

/* ---------------------------------------------------------------- util */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = (p) => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sum = (a, f) => a.reduce((t, x) => t + (f ? f(x) : x) || 0, 0);
const by = (a, k) => { const m = new Map(); for (const x of a) m.set(x[k], x); return m; };
const groupBy = (a, f) => { const m = new Map();
  for (const x of a) { const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; };
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

const Fmt = {
  gs(n, sinal) {
    if (n === "" || n === null || n === undefined || Number.isNaN(n)) return "—";
    const v = Math.round(n);
    const s = Math.abs(v).toLocaleString("de-DE");
    const pre = v < 0 ? "-Gs. " : (sinal && v > 0 ? "+Gs. " : "Gs. ");
    return pre + s;
  },
  gsCurto(n) {
    const v = Math.round(n || 0), a = Math.abs(v), sg = v < 0 ? "-" : "";
    if (a >= 1e9) return sg + (a / 1e9).toFixed(1).replace(".", ",") + " bi";
    if (a >= 1e6) return sg + (a / 1e6).toFixed(1).replace(".", ",") + " mi";
    if (a >= 1e3) return sg + Math.round(a / 1e3) + " mil";
    return sg + a;
  },
  num(n, d = 0) { return (n ?? 0).toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d }); },
  pct(n, d = 1) { return ((n || 0) * 100).toFixed(d).replace(".", ",") + "%"; },
  data(iso) { if (!iso) return "—"; const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; },
  dataCurta(iso) { if (!iso) return "—"; const [, m, d] = iso.split("-"); return `${d}/${m}`; },
  mesAno(iso) { if (!iso) return "—"; const [y, m] = iso.split("-"); return `${m}/${y}`; },
  compet(n) { return String(n).slice(4) + "/" + String(n).slice(0, 4); },
};

const MESES = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho",
  "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
const MESES_C = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];

const Dt = {
  hojeISO() { const d = new Date(); return Dt.iso(d.getFullYear(), d.getMonth() + 1, d.getDate()); },
  iso(y, m, d) { return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`; },
  parts(iso) { const [y, m, d] = iso.split("-").map(Number); return { y, m, d }; },
  diasNoMes(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); },
  diaMes(y, m, dia) { const yy = y + Math.floor((m - 1) / 12), mm = ((m - 1) % 12 + 12) % 12 + 1;
    return Dt.iso(yy, mm, Math.min(dia, Dt.diasNoMes(yy, mm))); },
  addMeses(iso, n) { const { y, m, d } = Dt.parts(iso); const t = (y * 12 + (m - 1)) + n;
    const yy = Math.floor(t / 12), mm = t % 12 + 1;
    return Dt.iso(yy, mm, Math.min(d, Dt.diasNoMes(yy, mm))); },
  addDias(iso, n) { const { y, m, d } = Dt.parts(iso);
    const t = new Date(Date.UTC(y, m - 1, d + n));
    return Dt.iso(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); },
  iniMes(iso) { const { y, m } = Dt.parts(iso); return Dt.iso(y, m, 1); },
  fimMes(iso) { const { y, m } = Dt.parts(iso); return Dt.iso(y, m, Dt.diasNoMes(y, m)); },
  iniAno(iso) { return Dt.parts(iso).y + "-01-01"; },
  fimAno(iso) { return Dt.parts(iso).y + "-12-31"; },
  diffDias(a, b) { const A = Dt.parts(a), B = Dt.parts(b);
    return Math.round((Date.UTC(A.y, A.m - 1, A.d) - Date.UTC(B.y, B.m - 1, B.d)) / 864e5); },
  diffMeses(a, b) { const A = Dt.parts(a), B = Dt.parts(b);
    return (A.y - B.y) * 12 + (A.m - B.m); },
  compet(iso) { const { y, m } = Dt.parts(iso); return y * 100 + m; },
  diaSemana(iso) { const { y, m, d } = Dt.parts(iso); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); },
  segundaDaSemana(iso) { const w = Dt.diaSemana(iso); return Dt.addDias(iso, w === 0 ? -6 : 1 - w); },
};

/* ------------------------------------------------------------- dominio */
const TIPOS_OP = ["RECEITA", "DESPESA", "TRANSFERENCIA", "COMPRA_CARTAO", "PAGAMENTO_CARTAO",
  "APORTE", "RESGATE", "RENDIMENTO", "PAGAMENTO_PARCELA", "AJUSTE_SALDO"];
const CLASSIF = {
  RECEITA: "RECEITA", RENDIMENTO: "RECEITA_FINANCEIRA", DESPESA: "DESPESA",
  COMPRA_CARTAO: "DESPESA", PAGAMENTO_PARCELA: "DESPESA", TRANSFERENCIA: "NEUTRO",
  PAGAMENTO_CARTAO: "NEUTRO", APORTE: "NEUTRO", RESGATE: "NEUTRO", AJUSTE_SALDO: "NEUTRO",
};
const ROTULO_OP = {
  RECEITA: "Receita", DESPESA: "Despesa", TRANSFERENCIA: "Transferência",
  COMPRA_CARTAO: "Compra no cartão", PAGAMENTO_CARTAO: "Pagamento de fatura",
  APORTE: "Aporte", RESGATE: "Resgate", RENDIMENTO: "Rendimento",
  PAGAMENTO_PARCELA: "Pagamento de parcela", AJUSTE_SALDO: "Ajuste de saldo",
};
/* origem e destino esperados por tipo de operacao (guia da tela de lancamento) */
const FLUXO_OP = {
  RECEITA: ["EXTERNO", "CONTA"], DESPESA: ["CONTA", "EXTERNO"],

  PAGAMENTO_CARTAO: ["CONTA", "CARTAO"], APORTE: ["CONTA", "INVESTIMENTO"],
  RESGATE: ["INVESTIMENTO", "CONTA"], RENDIMENTO: ["EXTERNO", "INVESTIMENTO"],
  PAGAMENTO_PARCELA: ["CONTA", "EXTERNO"], AJUSTE_SALDO: ["EXTERNO", "CONTA"],
};
const STATUS_LANC = ["REALIZADO", "PROJETADO", "CANCELADO"];
const TIPOS_ENT = ["CONTA", "CARTAO", "INVESTIMENTO", "EXTERNO"];
const TIPOS_CONTA = ["Conta corrente", "Conta poupança", "Carteira/dinheiro", "Outra"];
const FORMAS_PGTO = ["Dinheiro", "Débito", "Crédito", "Transferência", "Cheque",
  "Débito automático", "SIPAP/Giros", "Outro"];
const PERIODICIDADES = ["Diário", "Semanal", "Quinzenal", "Mensal", "Bimestral",
  "Trimestral", "Semestral", "Anual"];
const PASSO_MES = { Mensal: 1, Bimestral: 2, Trimestral: 3, Semestral: 6, Anual: 12 };
const PASSO_DIA = { "Diário": 1, Semanal: 7, Quinzenal: 15 };
const STATUS_CAD = ["Ativo", "Inativo", "Encerrado"];
const TIPOS_INV = ["Fondo Mutuo", "Ahorro a Plazo", "CDA", "Ações", "Outro"];
const BASES_REND = ["Taxa anual", "Taxa mensal", "Valor fixo", "Manual"];
const STATUS_META = ["Ativa", "Concluída", "Cancelada", "Pausada"];
const TIPOS_MOV_META = ["RESERVA", "RETIRADA", "TRANSF_ENTRADA", "TRANSF_SAIDA",
  "LIBERACAO_CONCLUSAO", "LIBERACAO_CANCELAMENTO"];
const SINAL_MOV = { RESERVA: 1, TRANSF_ENTRADA: 1, RETIRADA: -1, TRANSF_SAIDA: -1,
  LIBERACAO_CONCLUSAO: -1, LIBERACAO_CANCELAMENTO: -1 };
const DESTINOS_RET = ["Saldo disponível", "Outra meta", "Investimento", "Despesa",
  "Outra conta", "Outro"];
const TIPOS_INST = ["Banco", "Financeira", "Cooperativa", "Casa de câmbio",
  "Billetera/Fintech", "Corretora", "Não aplica", "Outra"];
const TIPOS_BEM = ["Imóvel", "Veículo", "Equipamento", "Participação societária",
  "Semovente", "Outro"];

const CATALOGO_PADRAO = [
  ["Alimentação", "DESPESA", ["Supermercado", "Restaurante", "Delivery", "Lanches", "Feira"]],
  ["Transporte", "DESPESA", ["Combustível", "Uber/Taxi", "Ônibus", "Manutenção", "Seguro veicular"]],
  ["Moradia", "DESPESA", ["Aluguel", "Energia (ANDE)", "Água (ESSAP)", "Internet", "Condomínio", "Manutenção do lar"]],
  ["Saúde", "DESPESA", ["Plano de saúde", "Farmácia", "Consultas", "Exames", "Odontologia"]],
  ["Educação", "DESPESA", ["Mensalidade", "Cursos", "Livros", "Material escolar"]],
  ["Lazer", "DESPESA", ["Viagens", "Streaming", "Eventos", "Bar e café"]],
  ["Compras", "DESPESA", ["Vestuário", "Eletrônicos", "Casa e decoração", "Presentes"]],
  ["Dívidas e Financiamentos", "DESPESA", ["Parcela de terreno", "Parcela de empréstimo", "Juros e multas", "Parcela de compra"]],
  ["Investimentos", "NEUTRO", ["Aporte", "Resgate", "Rendimento"]],
  ["Receitas", "RECEITA", ["Salário", "Aguinaldo (13º)", "Honorários/Freelance", "Rendimento financeiro", "Reembolso", "Outras receitas"]],
  ["Impostos e Taxas", "DESPESA", ["IVA", "IRP", "Tarifas bancárias", "Taxas municipais"]],
  ["Outros", "DESPESA", ["Diversos", "Não classificado"]],
  ["Transferências", "NEUTRO", ["Entre contas próprias", "Saque/Depósito"]],
];

const CONFIG_PADRAO = () => ({
  moeda: "Gs.", dataRef: Dt.hojeISO(), inicio: Dt.iso(Dt.parts(Dt.hojeISO()).y - 1, 12, 31),
  ano: Dt.parts(Dt.hojeISO()).y, mes: Dt.parts(Dt.hojeISO()).m, horizonte: 16,
  reservaNoFluxo: "SIM", saldoMin: 4000000, pctCartao: 0.8, diasAlerta: 7,
  diasInv: 60, pctRenda: 0.4, pctDesp: 0.25,
});

function catalogoPadrao() {
  const categorias = [], subcategorias = [];
  CATALOGO_PADRAO.forEach(([nome, tipo, subs], i) => {
    const cid = "CAT-" + String(i + 1).padStart(6, "0");
    categorias.push({ id: cid, nome, tipoPadrao: tipo });
    subs.forEach((s) => subcategorias.push({
      id: "SUB-" + String(subcategorias.length + 1).padStart(6, "0"),
      categoriaId: cid, nome: s,
    }));
  });
  return { categorias, subcategorias };
}

function dadosVazios() {
  const { categorias, subcategorias } = catalogoPadrao();
  return {
    config: CONFIG_PADRAO(), instituicoes: [], contas: [], cartoes: [], investimentos: [],
    categorias, subcategorias, compromissos: [], parcelas: [], metas: [], movMetas: [],
    recorrencias: [], bens: [], lancamentos: [],
  };
}

const LISTAS = ["instituicoes", "contas", "cartoes", "investimentos", "categorias",
  "subcategorias", "compromissos", "parcelas", "metas", "movMetas", "recorrencias",
  "bens", "lancamentos"];
const BLOCOS_GRANDES = ["lancamentos", "parcelas", "movMetas"];
const TAM_BLOCO = 150;

/* ------------------------------------------------------------- storage */
const Store = {
  db: null, pid: null, dirty: new Set(), timer: null, salvando: false,

  async init() {
    try { this.db = await claude.use("db"); } catch (e) { this.db = null; }
    return this.db != null;
  },
  get online() { return this.db != null; },

  /* ---- perfis ---- */
  async listarPerfis() {
    if (this.db) {
      try {
        const snap = await this.db.collection("perfis").get();
        return snap.docs.map((d) => ({ id: d.id, ...d.data() }))
          .sort((a, b) => String(a.criadoEm).localeCompare(String(b.criadoEm)));
      } catch (e) { console.warn("listarPerfis", e); return []; }
    }
    const raw = localStorage.getItem("cg.perfis");
    return raw ? JSON.parse(raw) : [];
  },
  async gravarPerfilMeta(meta) {
    if (this.db) { await this.db.doc("perfis/" + meta.id).set(meta); return; }
    const lista = await this.listarPerfis();
    const i = lista.findIndex((p) => p.id === meta.id);
    if (i >= 0) lista[i] = meta; else lista.push(meta);
    localStorage.setItem("cg.perfis", JSON.stringify(lista));
  },
  async criarPerfil(nome, dados) {
    const id = uid("perfil");
    const meta = { id, nome, criadoEm: new Date().toISOString(), atualizadoEm: new Date().toISOString() };
    await this.gravarPerfilMeta(meta);
    this.pid = id;
    await this.salvarTudo(dados);
    return meta;
  },
  async excluirPerfil(id) {
    if (this.db) {
      const snap = await this.db.collection(`perfis/${id}/dados`).get();
      for (const d of snap.docs) await this.db.doc(`perfis/${id}/dados/${d.id}`).delete();
      await this.db.doc("perfis/" + id).delete();
    } else {
      const lista = (await this.listarPerfis()).filter((p) => p.id !== id);
      localStorage.setItem("cg.perfis", JSON.stringify(lista));
      localStorage.removeItem("cg.dados." + id);
    }
  },
  async renomearPerfil(id, nome) {
    const lista = await this.listarPerfis();
    const meta = lista.find((p) => p.id === id);
    if (meta) { meta.nome = nome; await this.gravarPerfilMeta(meta); }
  },

  /* ---- dados ---- */
  _pequenos(d) {
    const o = { config: d.config };
    for (const k of LISTAS) if (!BLOCOS_GRANDES.includes(k)) o[k] = d[k];
    return o;
  },
  async carregar(pid) {
    this.pid = pid;
    if (!this.db) {
      const raw = localStorage.getItem("cg.dados." + pid);
      return raw ? Object.assign(dadosVazios(), JSON.parse(raw)) : dadosVazios();
    }
    const snap = await this.db.collection(`perfis/${pid}/dados`).get();
    const dados = dadosVazios();
    const partes = {};
    for (const doc of snap.docs) {
      const body = doc.data() || {};
      if (doc.id === "cadastros") Object.assign(dados, body);
      else {
        const m = doc.id.match(/^(.+)_(\d+)$/);
        if (m) { (partes[m[1]] = partes[m[1]] || []).push([Number(m[2]), body.itens || []]); }
      }
    }
    for (const [k, blocos] of Object.entries(partes)) {
      blocos.sort((a, b) => a[0] - b[0]);
      dados[k] = blocos.flatMap((b) => b[1]);
    }
    for (const k of LISTAS) if (!Array.isArray(dados[k])) dados[k] = [];
    dados.config = Object.assign(CONFIG_PADRAO(), dados.config || {});
    return dados;
  },
  async salvarTudo(d) {
    if (!this.db) { localStorage.setItem("cg.dados." + this.pid, JSON.stringify(d)); return; }
    await this.db.doc(`perfis/${this.pid}/dados/cadastros`).set(this._pequenos(d));
    for (const k of BLOCOS_GRANDES) await this._salvarBloco(k, d[k]);
  },
  async _salvarBloco(k, itens) {
    const n = Math.max(1, Math.ceil(itens.length / TAM_BLOCO));
    for (let i = 0; i < n; i++) {
      await this.db.doc(`perfis/${this.pid}/dados/${k}_${i}`)
        .set({ itens: itens.slice(i * TAM_BLOCO, (i + 1) * TAM_BLOCO) });
    }
    /* limpa blocos que sobraram de uma versao maior */
    for (let i = n; i < n + 6; i++) {
      try { await this.db.doc(`perfis/${this.pid}/dados/${k}_${i}`).delete(); } catch (e) { /* ok */ }
    }
  },
  marcar(...chaves) {
    for (const c of chaves) this.dirty.add(BLOCOS_GRANDES.includes(c) ? c : "cadastros");
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 700);
  },
  async flush() {
    if (!this.pid || this.salvando || !this.dirty.size) return;
    const alvos = Array.from(this.dirty); this.dirty.clear(); this.salvando = true;
    App.setSync("salvando");
    try {
      if (!this.db) localStorage.setItem("cg.dados." + this.pid, JSON.stringify(App.d));
      else for (const a of alvos) {
        if (a === "cadastros") await this.db.doc(`perfis/${this.pid}/dados/cadastros`).set(this._pequenos(App.d));
        else await this._salvarBloco(a, App.d[a]);
      }
      App.setSync("ok");
    } catch (e) {
      console.error(e); alvos.forEach((a) => this.dirty.add(a));
      App.setSync("erro", e && e.code);
    } finally { this.salvando = false; }
  },
};
