Views.bens = (v) => `
  <div class="page-head"><div><h1>Bens</h1>
    <p>Ativos que não são dinheiro: imóveis, veículos, equipamentos. Entram no patrimônio total, não no patrimônio financeiro.</p></div>
  <div style="flex:1"></div>${btnNovo("bem", "Novo bem")}</div>
  ${UI.card("", UI.tabela([
    { t: "Bem", f: (b) => `<b>${esc(b.nome)}</b><br><span class="hint">${esc(b.tipo || "")}</span>` },
    { t: "Valor", num: true, f: (b) => UI.moeda(b.valor) },
    { t: "Aquisição", f: (b) => esc(Fmt.data(b.dataAquisicao)) },
    { t: "Financiamento", f: (b) => esc(v.compromissos.find((c) => c.id === b.compromissoId)?.nome || "—") },
    { t: "Devedor", num: true, f: (b) => UI.moeda(v.compromissos.find((c) => c.id === b.compromissoId)?.devedor || 0) },
    { t: "Valor líquido", num: true, f: (b) => UI.moeda(b.valor - (v.compromissos.find((c) => c.id === b.compromissoId)?.devedor || 0)) },
    { t: "", f: (b) => acoes("bem", b.id) },
  ], v.dRaw.bens, { vazioTitulo: "Nenhum bem cadastrado",
    vazioMsg: "Opcional. Serve para o patrimônio não ficar negativo por causa de um financiamento.",
    vazioBotao: btnNovo("bem", "Novo bem") }), "", true)}`;
</script>
<script>
"use strict";
/* -------------------------------------------------------------- fluxo */
Views.fluxo = (v) => {
  const m = App.fluxoModo;
  const seg = ["mensal", "diario", "semanal", "anual"].map((k) =>
    `<button data-act="fluxo-modo" data-modo="${k}" aria-pressed="${m === k}">${k[0].toUpperCase() + k.slice(1)}</button>`).join("");
  let corpo = "", grafico = "";
  if (m === "mensal") {
    grafico = Chart.barras(v.fluxo.slice(0, 18), [
      { nome: "Entradas", val: (f) => f.entR + f.entP, cor: "var(--s2)" },
      { nome: "Saídas", val: (f) => -(f.saiR + f.saiP), cor: "var(--s4)" }],
      { rot: (f) => MESES_C[Number(String(f.compet).slice(4)) - 1] });
    corpo = UI.tabela([
      { t: "Competência", f: (f) => `<span class="mono">${esc(Fmt.compet(f.compet))}</span>` },
      { t: "Saldo inicial", num: true, f: (f) => UI.moeda(f.saldoIni) },
      { t: "Entradas realiz.", num: true, f: (f) => UI.moeda(f.entR) },
      { t: "Saídas realiz.", num: true, f: (f) => UI.moeda(-f.saiR) },
      { t: "Entradas proj.", num: true, f: (f) => UI.moeda(f.entP) },
      { t: "Saídas proj.", num: true, f: (f) => UI.moeda(-f.saiP) },
      { t: "Saldo final", num: true, f: (f) => `<b>${UI.moeda(f.saldoFim)}</b>` },
      { t: "Reservado", num: true, f: (f) => UI.moeda(-f.reservado) },
      { t: "Saldo livre", num: true, f: (f) => UI.moeda(f.livre) },
    ], v.fluxo);
  } else if (m === "diario") {
    corpo = UI.tabela([
      { t: "Dia", f: (f) => `<span class="mono">${esc(Fmt.data(f.data))}</span>${f.hoje ? " " + UI.tag("hoje", "acc") : ""}` },
      { t: "Entradas", num: true, f: (f) => UI.moeda(f.ent) },
      { t: "Saídas", num: true, f: (f) => UI.moeda(-f.sai) },
      { t: "Líquido", num: true, f: (f) => UI.moeda(f.liq, { positivo: true }) },
      { t: "Saldo acumulado", num: true, f: (f) => `<b>${UI.moeda(f.saldo)}</b>` },
      { t: "", f: (f) => f.futuro ? `<span class="hint">projetado</span>` : "" },
    ], v.diario.filter((f) => f.ent || f.sai || f.hoje));
    grafico = Chart.area(v.diario, (f) => f.saldo, { rot: (f) => Fmt.dataCurta(f.data), altura: 150 });
  } else if (m === "semanal") {
    corpo = UI.tabela([
      { t: "Semana", f: (f) => `<span class="mono">${esc(Fmt.dataCurta(f.ini))} a ${esc(Fmt.dataCurta(f.fim))}</span>` },
      { t: "Entradas", num: true, f: (f) => UI.moeda(f.ent) },
      { t: "Saídas", num: true, f: (f) => UI.moeda(-f.sai) },
      { t: "Líquido", num: true, f: (f) => UI.moeda(f.liq, { positivo: true }) },
      { t: "Saldo acumulado", num: true, f: (f) => `<b>${UI.moeda(f.saldo)}</b>` },
    ], v.semanal);
    grafico = Chart.area(v.semanal, (f) => f.saldo, { rot: (f) => Fmt.dataCurta(f.ini), altura: 150 });
  } else {
    corpo = UI.tabela([
      { t: "Ano", f: (f) => `<span class="mono">${f.ano}</span>` },
      { t: "Entradas realiz.", num: true, f: (f) => UI.moeda(f.entR) },
      { t: "Saídas realiz.", num: true, f: (f) => UI.moeda(-f.saiR) },
      { t: "Entradas proj.", num: true, f: (f) => UI.moeda(f.entP) },
      { t: "Saídas proj.", num: true, f: (f) => UI.moeda(-f.saiP) },
      { t: "Saldo no fim do ano", num: true, f: (f) => `<b>${UI.moeda(f.saldoFim)}</b>` },
    ], v.anos);
    grafico = Chart.barras(v.anos, [
      { nome: "Entradas", val: (f) => f.entR + f.entP, cor: "var(--s2)" },
      { nome: "Saídas", val: (f) => -(f.saiR + f.saiP), cor: "var(--s4)" }], { rot: (f) => String(f.ano) });
  }
  return `<div class="page-head"><div><h1>Fluxo de caixa</h1>
      <p>Só o que atravessa uma conta. Transferência entre contas próprias não aparece como entrada nem como saída, e compra no cartão só vira saída quando a fatura é paga.</p></div>
    <div style="flex:1"></div><div class="seg">${seg}</div></div>
    ${UI.card("Movimento do caixa", grafico)}
    ${UI.card("", corpo, "", true)}`;
};

/* ----------------------------------------------------------- projecao */
Views.projecao = (v) => `
  <div class="page-head"><div><h1>Projeção</h1>
    <p>O futuro mês a mês, considerando recorrências, parcelas, faturas, aportes, resgates e vencimentos já lançados. Nada aqui conta como realizado.</p></div></div>
  <div class="grid g4">
    ${UI.kpi("Saldo no fim do horizonte", Fmt.gs(v.projecao.length ? v.projecao[v.projecao.length - 1].saldo : 0))}
    ${UI.kpi("Menor saldo do período", Fmt.gs(v.indicadores.menorProj?.saldo ?? 0),
      v.indicadores.menorProj ? "em " + Fmt.compet(v.indicadores.menorProj.compet) : "",
      (v.indicadores.menorProj?.saldo ?? 0) < 0 ? "bad" : "good")}
    ${UI.kpi("Parcelas e faturas em 12 meses", Fmt.gs(v.indicadores.compr12))}
    ${UI.kpi("Renda comprometida", Fmt.pct(v.indicadores.pctRenda),
      "limite: " + Fmt.pct(v.cfg.pctRenda), v.indicadores.pctRenda > v.cfg.pctRenda ? "warn" : "")}
  </div>
  ${UI.card("Saldo projetado", Chart.area(v.projecao, (p) => p.saldo,
    { rot: (p) => MESES_C[Number(String(p.compet).slice(4)) - 1], altura: 180 }))}
  ${UI.card("", UI.tabela([
    { t: "Competência", f: (p) => `<span class="mono">${esc(Fmt.compet(p.compet))}</span>` },
    { t: "Receitas", num: true, f: (p) => UI.moeda(p.receitas) },
    { t: "Rendimentos", num: true, f: (p) => UI.moeda(p.rendimentos) },
    { t: "Despesas", num: true, f: (p) => UI.moeda(-p.despesas) },
    { t: "Parcelas", num: true, f: (p) => UI.moeda(-p.parcelas) },
    { t: "Faturas", num: true, f: (p) => UI.moeda(-p.faturas) },
    { t: "Aportes", num: true, f: (p) => UI.moeda(-p.aportes) },
    { t: "Resgates", num: true, f: (p) => UI.moeda(p.resgates) },
    { t: "Já realizado no mês", num: true, f: (p) => UI.moeda(p.liqR, { positivo: true }) },
    { t: "Saldo projetado", num: true, f: (p) => `<b>${UI.moeda(p.saldo)}</b>` },
  ], v.projecao), "", true)}`;

/* --------------------------------------------------------- relatorios */
Views.relMensal = (v) => {
  const { ano, mes } = App.rel;
  const ini = Dt.iso(ano, mes, 1), fim = Dt.fimMes(ini);
  const noPer = (l) => l.data >= ini && l.data <= fim;
  const R = v.R.filter(noPer), P = v.P.filter(noPer);
  const lin = (rot, campo, extra) => {
    const f = extra || (() => true);
    const r = sum(R.filter(f), (l) => l[campo]), p = sum(P.filter(f), (l) => l[campo]);
    return { rot, r, p, t: r + p };
  };
  const resumo = [
    lin("Receitas operacionais", "vRec"), lin("Receitas financeiras", "vRend"),
    lin("Despesas", "vDesp"), lin("Entradas de caixa", "entradaCaixa"),
    lin("Saídas de caixa", "saidaCaixa"),
    lin("Transferências entre contas", "valor", (l) => l.tipo === "TRANSFERENCIA"),
    lin("Aportes em investimentos", "valor", (l) => l.tipo === "APORTE"),
    lin("Resgates", "valor", (l) => l.tipo === "RESGATE"),
    lin("Compras no cartão", "valor", (l) => l.tipo === "COMPRA_CARTAO"),
    lin("Pagamentos de fatura", "valor", (l) => l.tipo === "PAGAMENTO_CARTAO"),
    lin("Parcelas de compromissos", "valor", (l) => l.tipo === "PAGAMENTO_PARCELA"),
  ];
  const res = resumo[0].t + resumo[1].t - resumo[2].t;
  const porCat = (lista) => v.dRaw.categorias.map((c) => ({ nome: c.nome,
    r: sum(lista.filter((l) => l.categoriaId === c.id), (l) => l.vDesp) }))
    .filter((x) => x.r).sort((a, b) => b.r - a.r);
  const porSub = v.dRaw.subcategorias.map((s) => ({ nome: s.nome,
    cat: v.idx.cat.get(s.categoriaId)?.nome ?? "",
    r: sum(R.filter((l) => l.subcategoriaId === s.id), (l) => l.vDesp),
    p: sum(P.filter((l) => l.subcategoriaId === s.id), (l) => l.vDesp) }))
    .filter((x) => x.r || x.p).sort((a, b) => (b.r + b.p) - (a.r + a.p));
  return `<div class="page-head"><div><h1>Relatório mensal</h1>
      <p>Resultado por competência e movimento de caixa do mês escolhido.</p></div>
    <div style="flex:1"></div>
    <div class="row"><select class="inp" style="width:130px" data-rel="mes">
        ${UI.opcoes(MESES.map((m, i) => ({ v: i + 1, t: m })), mes)}</select>
      <input class="inp" style="width:90px" type="number" data-rel="ano" value="${ano}"></div></div>
    <div class="grid g4">
      ${UI.kpi("Receitas", Fmt.gs(resumo[0].t + resumo[1].t), "realizado + projetado")}
      ${UI.kpi("Despesas", Fmt.gs(resumo[2].t), "realizado + projetado")}
      ${UI.kpi("Resultado do mês", Fmt.gs(res), "competência", res >= 0 ? "good" : "bad")}
      ${UI.kpi("Fluxo líquido de caixa", Fmt.gs(resumo[3].t - resumo[4].t), "entradas − saídas")}
    </div>
    <div class="split">
      ${UI.card("Resumo do mês", UI.tabela([
        { t: "Indicador", f: (x) => x.rot }, { t: "Realizado", num: true, f: (x) => UI.moeda(x.r) },
        { t: "Projetado", num: true, f: (x) => UI.moeda(x.p) },
        { t: "Total", num: true, f: (x) => `<b>${UI.moeda(x.t)}</b>` },
      ], resumo), "", true)}
      ${UI.card("Despesas por categoria", Chart.ranking(porCat(R).map((c) => ({ nome: c.nome, valor: c.r })), { limite: 10 }))}
    </div>
    ${UI.card("Despesas por subcategoria", UI.tabela([
      { t: "Categoria", f: (x) => `<span class="hint">${esc(x.cat)}</span>` },
      { t: "Subcategoria", f: (x) => `<b>${esc(x.nome)}</b>` },
      { t: "Realizado", num: true, f: (x) => UI.moeda(x.r) },
      { t: "Projetado", num: true, f: (x) => UI.moeda(x.p) },
      { t: "Total", num: true, f: (x) => `<b>${UI.moeda(x.r + x.p)}</b>` },
    ], porSub, { vazioTitulo: "Sem despesas no mês", vazioMsg: "Nenhuma despesa classificada neste período." }), "", true)}
    <div class="split">
      ${UI.card("Movimento por conta", UI.tabela([
        { t: "Conta", f: (c) => esc(c.nome) },
        { t: "Entradas", num: true, f: (c) => UI.moeda(sum(R.filter((l) => l.destinoTipo === "CONTA" && l.destinoId === c.id), (l) => l.valor)) },
        { t: "Saídas", num: true, f: (c) => UI.moeda(-sum(R.filter((l) => l.origemTipo === "CONTA" && l.origemId === c.id), (l) => l.valor)) },
        { t: "Saldo atual", num: true, f: (c) => `<b>${UI.moeda(c.saldo)}</b>` },
      ], v.contas), "", true)}
      ${UI.card("Movimento por cartão", UI.tabela([
        { t: "Cartão", f: (k) => esc(k.nome) },
        { t: "Compras", num: true, f: (k) => UI.moeda(sum(R.filter((l) => l.origemTipo === "CARTAO" && l.origemId === k.id), (l) => l.valor)) },
        { t: "Pagamentos", num: true, f: (k) => UI.moeda(-sum(R.filter((l) => l.destinoTipo === "CARTAO" && l.destinoId === k.id), (l) => l.valor)) },
        { t: "Dívida atual", num: true, f: (k) => `<b>${UI.moeda(k.divida)}</b>` },
      ], v.cartoes), "", true)}
    </div>`;
};

Views.relAnual = (v) => {
  const ano = App.rel.ano;
  const meses = Array.from({ length: 12 }, (_, i) => {
    const ini = Dt.iso(ano, i + 1, 1), fim = Dt.fimMes(ini);
    const L = v.ativos.filter((l) => l.data >= ini && l.data <= fim);
    const rec = sum(L, (l) => l.vRec), rend = sum(L, (l) => l.vRend), desp = sum(L, (l) => l.vDesp);
    return { mes: MESES[i], ini, fim, rec, rend, desp, resultado: rec + rend - desp,
      aportes: sum(L.filter((l) => l.tipo === "APORTE"), (l) => l.valor),
      resgates: sum(L.filter((l) => l.tipo === "RESGATE"), (l) => l.valor),
      ent: sum(L, (l) => l.entradaCaixa), sai: sum(L, (l) => l.saidaCaixa),
      saldo: v.saldoAte(Dt.addDias(fim, 1)) };
  });
  const T = (k) => sum(meses, (m) => m[k]);
  const catAno = v.dRaw.categorias.map((c) => ({ nome: c.nome,
    valor: sum(v.ativos.filter((l) => l.categoriaId === c.id && Dt.parts(l.data).y === ano), (l) => l.vDesp) }))
    .filter((x) => x.valor).sort((a, b) => b.valor - a.valor);
  const maiorD = meses.reduce((a, m) => (m.desp > a.desp ? m : a), meses[0]);
  const menorD = meses.reduce((a, m) => (m.desp < a.desp ? m : a), meses[0]);
  const evDez = v.evolucao.find((e) => e.compet === ano * 100 + 12);
  const evJan = v.evolucao.find((e) => e.compet === ano * 100 + 1);
  return `<div class="page-head"><div><h1>Relatório anual</h1>
      <p>Os doze meses de ${ano}, somando realizado e projetado.</p></div>
    <div style="flex:1"></div><input class="inp" style="width:100px" type="number" data-rel="ano" value="${ano}"></div>
    <div class="grid g4">
      ${UI.kpi("Receitas do ano", Fmt.gs(T("rec") + T("rend")))}
      ${UI.kpi("Despesas do ano", Fmt.gs(T("desp")))}
      ${UI.kpi("Resultado", Fmt.gs(T("resultado")), "", T("resultado") >= 0 ? "good" : "bad")}
      ${UI.kpi("Taxa de poupança", Fmt.pct(T("rec") ? T("resultado") / (T("rec") + T("rend")) : 0))}
    </div>
    ${UI.card("Receitas e despesas por mês", Chart.barras(meses, [
      { nome: "Receitas", val: (m) => m.rec + m.rend, cor: "var(--s2)" },
      { nome: "Despesas", val: (m) => -m.desp, cor: "var(--s4)" }],
      { rot: (m) => m.mes.slice(0, 3).toLowerCase() }))}
    ${UI.card("", UI.tabela([
      { t: "Mês", f: (m) => m.mes }, { t: "Receitas", num: true, f: (m) => UI.moeda(m.rec) },
      { t: "Rendimentos", num: true, f: (m) => UI.moeda(m.rend) },
      { t: "Despesas", num: true, f: (m) => UI.moeda(-m.desp) },
      { t: "Resultado", num: true, f: (m) => UI.moeda(m.resultado, { positivo: true }) },
      { t: "Aportes", num: true, f: (m) => UI.moeda(m.aportes) },
      { t: "Resgates", num: true, f: (m) => UI.moeda(m.resgates) },
      { t: "Entradas", num: true, f: (m) => UI.moeda(m.ent) },
      { t: "Saídas", num: true, f: (m) => UI.moeda(-m.sai) },
      { t: "Saldo no fim", num: true, f: (m) => `<b>${UI.moeda(m.saldo)}</b>` },
    ], meses, { rodape: {} }), "", true)}
    <div class="split">
      ${UI.card("Despesas do ano por categoria", Chart.ranking(catAno, { limite: 12 }))}
      ${UI.card("Destaques do ano", `<div class="list-lines">
        ${[["Maior despesa mensal", `${Fmt.gs(maiorD.desp)} em ${maiorD.mes}`],
           ["Menor despesa mensal", `${Fmt.gs(menorD.desp)} em ${menorD.mes}`],
           ["Média mensal de despesa", Fmt.gs(T("desp") / 12)],
           ["Categoria de maior gasto", catAno[0] ? `${catAno[0].nome} — ${Fmt.gs(catAno[0].valor)}` : "—"],
           ["Patrimônio em 31/12", evDez ? Fmt.gs(evDez.plTotal) : "fora da grade"],
           ["Evolução no ano", evDez && evJan ? Fmt.gs(evDez.plTotal - evJan.plTotal, true) : "—"],
          ].map(([a, b]) => `<div class="line-item"><div class="li-m"><b>${esc(a)}</b></div>
            <span class="mono" style="font-weight:600">${esc(b)}</span></div>`).join("")}
      </div>`)}
    </div>`;
};

/* -------------------------------------------------------- patrimonio */
Views.patrimonio = (v) => {
  const p = v.patrimonio;
  const linha = (rot, val, forte) => `<div class="line-item"><div class="li-m">
    <b style="${forte ? "font-weight:700" : "font-weight:500"}">${esc(rot)}</b></div>
    <span class="mono" style="font-weight:${forte ? 700 : 500}">${esc(Fmt.gs(val))}</span></div>`;
  return `<div class="page-head"><div><h1>Patrimônio</h1>
      <p>Patrimônio financeiro considera contas, investimentos, cartões e compromissos. O total soma também os bens cadastrados.</p></div></div>
    <div class="grid g4">
      ${UI.kpi("Total de ativos", Fmt.gs(p.ativos))}
      ${UI.kpi("Total de passivos", Fmt.gs(p.passivos))}
      ${UI.kpi("Patrimônio financeiro", Fmt.gs(p.plFin), "sem os bens", p.plFin >= 0 ? "good" : "bad")}
      ${UI.kpi("Patrimônio total", Fmt.gs(p.plTotal), "com os bens", "lead")}
    </div>
    <div class="split">
      ${UI.card("Composição atual", `<div class="list-lines">
        ${linha("Contas e dinheiro", p.contas)}${linha("Investimentos", p.investimentos)}
        ${linha("Ativos financeiros", p.ativosFin, true)}${linha("Bens", p.bens)}
        ${linha("Total de ativos", p.ativos, true)}
        ${linha("Dívida de cartões", -p.cartoes)}${linha("Saldo devedor de compromissos", -p.compromissos)}
        ${linha("Total de passivos", -p.passivos, true)}
        ${linha("Patrimônio líquido total", p.plTotal, true)}
        ${linha("Memória: reservado em metas", p.reservado)}${linha("Memória: saldo livre", p.livre)}
      </div>`)}
      ${UI.card("Evolução do patrimônio", Chart.area(v.evolucao, (e) => e.plTotal,
        { rot: (e) => MESES_C[Number(String(e.compet).slice(4)) - 1], altura: 180 }),
        `<span class="hint">realizado + projetado</span>`)}
    </div>
    ${UI.card("", UI.tabela([
      { t: "Competência", f: (e) => `<span class="mono">${esc(Fmt.compet(e.compet))}</span>` },
      { t: "Contas", num: true, f: (e) => UI.moeda(e.contas) },
      { t: "Investimentos", num: true, f: (e) => UI.moeda(e.investimentos) },
      { t: "Bens", num: true, f: (e) => UI.moeda(e.bens) },
      { t: "Cartões", num: true, f: (e) => UI.moeda(-e.cartoes) },
      { t: "Compromissos", num: true, f: (e) => UI.moeda(-e.compromissos) },
      { t: "PL financeiro", num: true, f: (e) => UI.moeda(e.plFin) },
      { t: "PL total", num: true, f: (e) => `<b>${UI.moeda(e.plTotal)}</b>` },
      { t: "Variação", num: true, f: (e) => UI.moeda(e.variacao, { sinal: true, positivo: true }) },
    ], v.evolucao), "", true)}`;
};
</script>

const Form = {
  entidadeOpts(d, tipo) {
    if (tipo === "CONTA") return optsDe(d.contas);
    if (tipo === "CARTAO") return optsDe(d.cartoes);
    if (tipo === "INVESTIMENTO") return optsDe(d.investimentos);
    return [];
  },
  html(tipo, reg, d) {
    const spec = FORMS[tipo];
    return `<div class="fgrid">` + spec.campos(d).map((c) => {
      let val = reg[c.n];
      if (val === undefined || val === null || val === "")
        val = typeof c.def === "function" ? c.def(d) : (c.def ?? "");
      let opts = c.opts;
      if (c.entidade) opts = Form.entidadeOpts(d, reg[c.entidade] ?? "");
      if (c.dep) opts = optsDe(d.subcategorias.filter((s) => s.categoriaId === (reg[c.dep] || "")));
      if (c.parcelas) {
        const ps = d.parcelas.filter((p) => p.compromissoId === (reg.compromissoId || ""));
        const c2 = d.compromissos.find((x) => x.id === reg.compromissoId);
        opts = ps.map((p) => ({ v: p.id, t: `${p.num}/${c2 ? c2.qtd : "?"} — vence ${Fmt.data(p.vencimento)}` }));
      }
      const attr = `${c.req ? " required" : ""}${c.min !== undefined ? ` min="${c.min}"` : ""}${c.max !== undefined ? ` max="${c.max}"` : ""}`;
      if (c.t === "select")
        return UI.campo(c.l, `<select class="inp" name="${c.n}" data-campo="${c.n}"${attr}>${UI.opcoes(opts || [], val, c.vazio)}</select>`, c.full);
      const tipoIn = c.t === "date" ? "date" : (c.t === "money" || c.t === "num" || c.t === "int") ? "number" : "text";
      const step = c.t === "num" ? "0.0001" : c.t === "money" ? "1" : c.t === "int" ? "1" : "";
      return UI.campo(c.l, `<input class="inp${c.t === "money" || c.t === "num" || c.t === "int" ? " num" : ""}"
        name="${c.n}" data-campo="${c.n}" type="${tipoIn}" value="${esc(val)}"${step ? ` step="${step}"` : ""}${attr}>`, c.full);
    }).join("") + `</div>`;
  },
  ler(form, tipo, d) {
    const spec = FORMS[tipo], out = {};
    for (const c of spec.campos(d)) {
      const el = form.elements[c.n];
      if (!el) continue;
      let v = el.value;
      if (c.t === "money" || c.t === "num" || c.t === "int") v = v === "" ? 0 : Number(v);
      out[c.n] = v;
    }
    return out;
  },
};

const NAV = [
  ["Visão geral", [["painel", "Painel"], ["alertas", "Alertas"], ["indicadores", "Indicadores"]]],
  ["Movimento", [["lancamentos", "Lançamentos"], ["compromissos", "Compromissos"],
    ["metas", "Metas"], ["recorrencias", "Recorrências"]]],
  ["Cadastros", [["contas", "Contas"], ["cartoes", "Cartões"], ["investimentos", "Investimentos"],
    ["categorias", "Categorias"], ["instituicoes", "Instituições"], ["bens", "Bens"]]],
  ["Análise", [["fluxo", "Fluxo de caixa"], ["projecao", "Projeção"],
    ["relMensal", "Relatório mensal"], ["relAnual", "Relatório anual"], ["patrimonio", "Patrimônio"]]],
  ["Sistema", [["testes", "Conferência"], ["config", "Configurações"]]],
];

const App = {
  d: null, v: null, perfis: [], perfilNome: "", rota: "painel", sync: "ok", pronto: false,
  filtros: { q: "", status: "", tipo: "", entidade: "", categoria: "", mes: "" },
  rel: { ano: 0, mes: 0 }, abertos: new Set(), fluxoModo: "mensal", modalCtx: null,

  /* ------------------------------------------------------------ boot */
  async boot() {
    await Store.init();
    this.perfis = await Store.listarPerfis();
    const ultimo = localStorage.getItem("cg.ultimo");
    const alvo = this.perfis.find((p) => p.id === ultimo) || this.perfis[0];
    if (alvo) await this.abrirPerfil(alvo.id);
    else this.renderOnboarding();
    document.addEventListener("click", (e) => this.onClick(e));
    document.addEventListener("change", (e) => this.onChange(e));
    document.addEventListener("input", (e) => this.onInput(e));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") this.fecharModal(); });
    window.addEventListener("beforeunload", () => { if (Store.dirty.size) Store.flush(); });
  },
  async abrirPerfil(pid) {
    this.d = await Store.carregar(pid);
    const meta = this.perfis.find((p) => p.id === pid);
    this.perfilNome = meta ? meta.nome : "Meu perfil";
    localStorage.setItem("cg.ultimo", pid);
    this.rel = { ano: Dt.parts(this.d.config.dataRef).y, mes: Dt.parts(this.d.config.dataRef).m };
    this.filtros.mes = "";
    this.pronto = true;
    this.recalc(); this.render();
  },
  recalc() {
    this.v = Calc.derivar(this.d);
    this.v.indicadores = Calc.indicadores(this.v);
    this.v.alertas = Calc.alertas(this.v);
    this.v.testes = Calc.testes(this.v);
  },
  salvar(...blocos) { Store.marcar(...blocos); this.recalc(); this.render(); },
  setSync(s, cod) { this.sync = s; const el = $("#sync"); if (el) el.outerHTML = this.syncHTML(); },
  syncHTML() {
    const m = { salvando: ["aviso", "salvando…"], ok: ["bom", Store.online ? "salvo online" : "salvo neste navegador"],
      erro: ["grave", "erro ao salvar"] }[this.sync] || ["neutro", ""];
    return `<span id="sync" class="tag t-${m[0]}"><i class="dot"></i>${esc(m[1])}</span>`;
  },

  /* ---------------------------------------------------------- render */
  render() {
    if (!this.pronto) return this.renderOnboarding();
    const v = this.v, falhas = v.testes.filter((t) => !t.ok).length;
    const graves = v.alertas.filter((a) => a.nivel === "grave").length;
    const nav = NAV.map(([g, itens]) => `<div class="nav-group">${esc(g)}</div>` + itens.map(([r, rot]) => {
      const badge = r === "alertas" && graves ? `<span class="nav-badge">${graves}</span>`
        : r === "testes" && falhas ? `<span class="nav-badge">${falhas}</span>` : "";
      return `<button class="nav-item" data-act="ir" data-rota="${r}"${this.rota === r ? ' aria-current="page"' : ""}>
        ${esc(rot)}${badge}</button>`;
    }).join("")).join("");
    const view = (Views[this.rota] || Views.painel)(v);
    $("#app").innerHTML = `<div class="app">
      <aside class="side">
        <div class="brand"><div class="brand-mark">Gs</div>
          <div><div class="brand-name">Caja Guaraní</div><div class="brand-sub">${esc(this.perfilNome)}</div></div></div>
        <nav class="nav">${nav}</nav>
      </aside>
      <div class="main">
        <header class="topbar">
          <span class="hint no-mob">Referência</span>
          <input class="inp" style="width:145px;max-width:42vw" type="date" data-cfg="dataRef" value="${esc(v.cfg.dataRef)}">
          <div class="sp"></div>
          <span class="no-mob">${this.syncHTML()}</span>
          <button class="btn btn-sm" data-act="ajuda" title="O que esta tela faz"
            aria-label="Ajuda desta tela">? <span class="no-mob">Ajuda</span></button>
          <button class="btn btn-sm no-mob" data-act="ir" data-rota="config">Perfis</button>
          <button class="btn btn-pri btn-sm no-mob" data-act="novo" data-tipo="lancamento">+ Lançamento</button>
        </header>
        <main class="page">${view}</main>
      </div>
      ${this.barraMobile(graves, falhas)}
      <button class="fab" data-act="novo" data-tipo="lancamento" aria-label="Novo lançamento">+</button>
      <div class="sheet-wrap" id="sheet"></div></div>`;
    window.scrollTo(0, 0);
  },
  barraMobile(graves, falhas) {
    const abas = [["painel", "Painel", "painel"], ["lancamentos", "Lançar", "lancamentos"],
      ["contas", "Contas", "contas"]];
    const grupoAnalise = ["fluxo", "projecao", "relMensal", "relAnual", "patrimonio", "indicadores"];
    const naAnalise = grupoAnalise.includes(this.rota);
    const outras = !abas.some((a) => a[0] === this.rota) && !naAnalise;
    return `<nav class="mob-bar" aria-label="Navegação principal">
      ${abas.map(([r, rot, ic]) => `<button data-act="ir" data-rota="${r}"
        ${this.rota === r ? 'aria-current="page"' : ""}>${ico(ic)}${esc(rot)}</button>`).join("")}
      <button data-act="folha" data-folha="analise" ${naAnalise ? 'aria-current="page"' : ""}>
        ${ico("analise")}Análise</button>
      <button data-act="folha" data-folha="mais" ${outras ? 'aria-current="page"' : ""}>
        ${ico("mais")}Mais${graves || falhas ? `<span class="nb">${graves + falhas}</span>` : ""}</button>
    </nav>`;
  },
  folha(qual) {
    const graves = this.v.alertas.filter((a) => a.nivel === "grave").length;
    const falhas = this.v.testes.filter((t) => !t.ok).length;
    const item = (r, rot, badge) => `<button class="sheet-item" data-act="ir" data-rota="${r}"
      ${this.rota === r ? 'aria-current="page"' : ""}>${esc(rot)}
      ${badge ? `<span class="nav-badge" style="margin-left:auto">${badge}</span>` : ""}</button>`;
    const corpo = qual === "analise"
      ? `<div class="sheet-sec">Análise</div>${item("fluxo", "Fluxo de caixa")}${item("projecao", "Projeção")}
         ${item("relMensal", "Relatório mensal")}${item("relAnual", "Relatório anual")}
         ${item("patrimonio", "Patrimônio")}${item("indicadores", "Indicadores")}`
      : `<div class="sheet-sec">Movimento</div>${item("compromissos", "Compromissos e parcelas")}
         ${item("metas", "Metas")}${item("recorrencias", "Recorrências")}
         <div class="sheet-sec">Cadastros</div>${item("cartoes", "Cartões")}
         ${item("investimentos", "Investimentos")}${item("categorias", "Categorias")}
         ${item("instituicoes", "Instituições")}${item("bens", "Bens")}
         <div class="sheet-sec">Sistema</div>${item("alertas", "Alertas", graves)}
         ${item("testes", "Conferência", falhas)}${item("config", "Configurações e perfis")}
         <button class="sheet-item" data-act="ajuda">Ajuda desta tela</button>
         <div style="padding:12px 16px">${this.syncHTML()}</div>`;
    const el = $("#sheet");
    el.innerHTML = `<div class="sheet" role="dialog" aria-label="Menu"><div class="sheet-grip"></div>
      <div class="sheet-h"><h3>${qual === "analise" ? "Análise" : "Mais"}</h3>
        <button class="btn btn-sm" data-act="fechar-folha">Fechar</button></div>${corpo}</div>`;
    el.classList.add("on");
    el.onclick = (e) => { if (e.target === el) this.fecharFolha(); };
  },
  fecharFolha() { const el = $("#sheet"); if (el) { el.classList.remove("on"); el.innerHTML = ""; } },

  /* ----------------------------------------------------------- ajuda */
  ajuda(rota) {
    const a = AJUDA[rota || this.rota] || AJUDA.painel;
    this.fecharFolha();
    this.modal({ titulo: "Ajuda — " + a.t, ok: "", largura: 720,
      corpo: `<div><p class="ajuda-sec">O que esta tela faz</p>
          <p class="ajuda-p">${a.oque}</p></div>
        <div><p class="ajuda-sec">Como se liga com as outras</p>
          <div class="ajuda-lig">${a.ligacoes.map(([r, txt]) =>
            `<button data-act="ir-ajuda" data-rota="${r}"><b>${esc(AJUDA[r] ? AJUDA[r].t : r)}</b>
              <span>${esc(txt)}</span></button>`).join("")}</div></div>
        <div><p class="ajuda-sec">Se algo não funcionar</p>
          <div class="ajuda-prob">${a.problemas.map(([q, r]) =>
            `<div><b>${esc(q)}</b><span>${esc(r)}</span></div>`).join("")}</div></div>
        <p class="hint" style="margin-top:6px">Continua sem fechar? Em Configurações, baixe a cópia
          em JSON e mande para quem montou o sistema: ela tem tudo o que é preciso para reproduzir o problema.</p>` });
  },
  renderOnboarding(msg) {
    const temDemo = !!DEMO;
    $("#app").innerHTML = `<div class="onb"><div class="onb-card">
      <div class="onb-top"><h1>Caja Guaraní</h1>
        <p>Controle financeiro pessoal em guaraníes: contas, cartões, parcelamentos, investimentos,
        metas, fluxo de caixa, projeção e patrimônio. Escolha por onde começar.</p></div>
      <div class="onb-b">
        ${msg ? `<div class="aviso-box i">${esc(msg)}</div>` : ""}
        <div class="field"><label>Nome deste perfil</label>
          <input class="inp" id="onb-nome" value="Meu controle" maxlength="60"></div>
        <button class="choice" data-act="novo-perfil-vazio"><span class="ci">◇</span>
          <span><b>Começar do zero</b><span>Sem nenhum registro. Vem só com as 13 categorias
          e 54 subcategorias padrão, prontas para editar.</span></span></button>
        ${temDemo ? `<button class="choice" data-act="novo-perfil-demo"><span class="ci">◈</span>
          <span><b>Abrir com dados de exemplo</b><span>602 lançamentos fictícios de jan/2026 a jan/2028,
          com 3 contas, 2 cartões, 2 investimentos, um terreno na parcela 44/60 e 4 metas.
          Serve para conhecer o sistema antes de colocar os seus números.</span></span></button>` : ""}
        ${this.perfis.length ? `<div><div class="nav-group" style="padding-left:0">Perfis já criados</div>
          <div class="perfil-lista">${this.perfis.map((p) => `<div class="perfil-item"><b>${esc(p.nome)}</b>
            <button class="btn btn-sm btn-pri" data-act="trocar-perfil" data-id="${esc(p.id)}">Abrir</button></div>`).join("")}
          </div></div>` : ""}
        <p class="hint">${Store.online ? "Seus dados ficam salvos online, na sua conta, e voltam em qualquer aparelho."
          : "O banco online não respondeu nesta sessão: os dados serão salvos apenas neste navegador."}</p>
      </div></div></div>`;
  },

  /* --------------------------------------------------------- helpers */
  lancamentosFiltrados(v) {
    const f = this.filtros;
    let l = v.L.slice().sort((a, b) => b.data.localeCompare(a.data) || b.id.localeCompare(a.id));
    if (f.q) { const q = f.q.toLowerCase(); l = l.filter((x) => (x.descricao || "").toLowerCase().includes(q)
      || (x.obs || "").toLowerCase().includes(q)); }
    if (f.status) l = l.filter((x) => x.status === f.status);
    if (f.tipo) l = l.filter((x) => x.tipo === f.tipo);
    if (f.entidade) l = l.filter((x) => x.origemId === f.entidade || x.destinoId === f.entidade);
    if (f.categoria) l = l.filter((x) => x.categoriaId === f.categoria);
    if (f.mes) l = l.filter((x) => x.data.slice(0, 7) === f.mes);
    return l;
  },
  proximoId(pre, lista) {
    let max = 0;
    for (const x of lista) { const m = String(x.id || "").match(/-(\d+)$/); if (m) max = Math.max(max, +m[1]); }
    return pre + "-" + String(max + 1).padStart(6, "0");
  },
  toast(msg, err) {
    const t = document.createElement("div");
    t.className = "toast" + (err ? " err" : ""); t.textContent = msg;
    $("#toasts").appendChild(t);
    setTimeout(() => t.remove(), err ? 6000 : 3200);
  },

  /* ----------------------------------------------------------- modal */
  modal({ titulo, corpo, ok = "Salvar", onOk, largura }) {
    this.fecharModal();
    const o = document.createElement("div");
    o.className = "ovl"; o.id = "ovl";
    o.innerHTML = `<div class="modal" ${largura ? `style="width:min(${largura}px,100%)"` : ""} role="dialog" aria-modal="true">
      <div class="modal-h"><h3>${esc(titulo)}</h3><div class="sp" style="flex:1"></div>
        <button class="btn btn-sm" data-act="fechar-modal">Fechar</button></div>
      <form class="modal-b" id="modal-form">${corpo}</form>
      <div class="modal-f"><button class="btn" data-act="fechar-modal">Cancelar</button>
        ${ok ? `<button class="btn btn-pri" data-act="modal-ok">${esc(ok)}</button>` : ""}</div></div>`;
    document.body.appendChild(o);
    o.addEventListener("click", (e) => { if (e.target === o) this.fecharModal(); });
    const f = $("#modal-form", o);
    f.addEventListener("submit", (e) => { e.preventDefault(); onOk && onOk(f); });
    this.modalOk = onOk;
    const first = f.querySelector("input,select,textarea");
    if (first) setTimeout(() => first.focus(), 30);
  },
  fecharModal() { const o = $("#ovl"); if (o) o.remove(); this.modalOk = null; this.modalCtx = null; },
  confirmar(titulo, msg, rotulo = "Confirmar") {
    return new Promise((res) => {
      this.modal({ titulo, corpo: `<p style="margin:0;max-width:60ch">${msg}</p>`, ok: rotulo,
        onOk: () => { this.fecharModal(); res(true); } });
      $("#ovl").addEventListener("click", (e) => {
        if (e.target.dataset.act === "fechar-modal" || e.target === $("#ovl")) res(false);
      });
    });
  },
};
</script>
<script>
"use strict";
/* ==================================================================== */
/*  ACOES                                                                */
/* ==================================================================== */
Object.assign(App, {
  onClick(e) {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const { act, tipo, id, rota, modo, mov, folha, passo, i } = b.dataset;
    const acoes = {
      ir: () => { this.fecharFolha(); this.fecharModal(); this.rota = rota; this.render(); },
      "ir-ajuda": () => { this.fecharModal(); this.rota = rota; this.render();
        setTimeout(() => this.ajuda(rota), 60); },
      ajuda: () => this.ajuda(),
      folha: () => this.folha(folha),
      "fechar-folha": () => this.fecharFolha(),
      "guia-fazer": () => this.guiaFazer(passo),
      "guia-pular": () => this.guiaMarcar(passo, "guiaPulados"),
      "guia-marcar": () => this.guiaMarcar(passo, "guiaFeitos"),
      "guia-fechar": () => { this.d.config.guiaOculto = true; this.d.config.guiaAtivo = false;
        this.salvar("config"); this.toast("Guia escondido. Volta em Configurações."); },
      "guia-mostrar": () => { this.d.config.guiaOculto = false; this.d.config.guiaAtivo = true;
        this.rota = "painel"; this.salvar("config"); },
      "guia-voltar": () => { this.fecharModal(); Guia.abrirBoasVindas(Number(i)); },
      "guia-boasvindas": () => Guia.abrirBoasVindas(0),
      "fechar-modal": () => this.fecharModal(),
      "modal-ok": () => { const f = $("#modal-form"); if (f && f.reportValidity() && this.modalOk) this.modalOk(f); },
      novo: () => this.editar(tipo, null),
      editar: () => this.editar(tipo, id),
      excluir: () => this.excluir(tipo, id),
      realizar: () => this.mudarStatus(id, "REALIZADO"),
      "cancelar-lanc": () => this.mudarStatus(id, "CANCELADO"),
      reativar: () => this.mudarStatus(id, "REALIZADO"),
      "pagar-parcela": () => this.pagarParcela(id),
      toggle: () => { this.abertos.has(id) ? this.abertos.delete(id) : this.abertos.add(id); this.render(); },
      resgatar: () => this.resgatar(id),
      "mov-meta": () => this.movMeta(id, mov),
      "concluir-meta": () => this.encerrarMeta(id, "Concluída"),
      "cancelar-meta": () => this.encerrarMeta(id, "Cancelada"),
      "gerar-rec": () => this.gerarRecorrencia(id),
      "fluxo-modo": () => { this.fluxoModo = modo; this.render(); },
      "limpar-filtros": () => { this.filtros = { q: "", status: "", tipo: "", entidade: "", categoria: "", mes: "" }; this.render(); },
      "novo-perfil-vazio": () => this.criarPerfil(false),
      "novo-perfil-demo": () => this.criarPerfil(true),
      "trocar-perfil": () => this.abrirPerfil(id),
      "renomear-perfil": () => this.renomearPerfil(id),
      "excluir-perfil": () => this.apagarPerfil(id),
      exportar: () => this.exportar(),
      importar: () => this.importar(),
      zerar: () => this.zerar(),
    };
    if (acoes[act]) { e.preventDefault(); acoes[act](); }
  },
  onChange(e) {
    const t = e.target;
    if (t.dataset.filtro) { this.filtros[t.dataset.filtro] = t.value; this.render(); return; }
    if (t.dataset.rel) { this.rel[t.dataset.rel] = Number(t.value) || this.rel[t.dataset.rel]; this.render(); return; }
    if (t.dataset.cfg) {
      const k = t.dataset.cfg;
      this.d.config[k] = t.type === "number" ? Number(t.value) : t.value;
      this.salvar("config"); return;
    }
    if (t.dataset.campo && this.modalCtx) {
      const c = this.modalCtx; c.reg[t.dataset.campo] = t.value;
      if (c.tipo === "lancamento" && t.dataset.campo === "tipo") {
        const f = FLUXO_OP[t.value]; if (f) { c.reg.origemTipo = f[0]; c.reg.destinoTipo = f[1]; }
        c.reg.origemId = ""; c.reg.destinoId = "";
      }
      if (["tipo", "origemTipo", "destinoTipo", "categoriaId", "compromissoId"].includes(t.dataset.campo)) {
        if (t.dataset.campo === "origemTipo") c.reg.origemId = "";
        if (t.dataset.campo === "destinoTipo") c.reg.destinoId = "";
        if (t.dataset.campo === "categoriaId") c.reg.subcategoriaId = "";
        if (t.dataset.campo === "compromissoId") c.reg.parcelaId = "";
        c.rerender();
      }
    }
  },
  onInput(e) {
    if (e.target.dataset.filtro === "q") {
      clearTimeout(this._tq);
      this._tq = setTimeout(() => { this.filtros.q = e.target.value; this.render();
        const i = $('[data-filtro="q"]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 320);
    }
  },

  /* --------------------------------------------------- CRUD generico */
  editar(tipo, id) {
    const spec = FORMS[tipo], lista = this.d[spec.lista];
    const orig = id ? lista.find((x) => x.id === id) : null;
    const reg = orig ? { ...orig } : {};
    const dica = tipo === "lancamento"
      ? `<div class="aviso-box i">Toda operação sai de uma <b>origem</b> e vai para um <b>destino</b>.
         Ao escolher o tipo, o sistema já sugere o caminho certo. <i>Externo</i> é o mundo fora do seu controle:
         o empregador, o supermercado.</div>` : "";
    const avisoVinc = orig && tipo === "lancamento" && this.v.L.find((l) => l.id === id)?.vinculos.length
      ? `<div class="aviso-box a">Este lançamento está vinculado a
         ${esc(this.v.L.find((l) => l.id === id).vinculos.join(", "))}. Alterar valor, data ou status pode
         mudar o estado de uma parcela ou de uma meta.</div>` : "";
    const corpo = () => dica + avisoVinc + Form.html(tipo, reg, this.d);
    this.modal({ titulo: (id ? "Editar " : "Novo ") + spec.rot.toLowerCase(), corpo: corpo(),
      largura: tipo === "lancamento" || tipo === "compromisso" || tipo === "recorrencia" ? 900 : 620,
      onOk: (f) => {
        const dados = Form.ler(f, tipo, this.d);
        if (tipo === "lancamento") {
          const teste = Calc.validarLanc({ ...dados, ...{} }, this.v.idx, this.v.ent);
          if (teste !== "OK") { this.toast("Não dá para salvar: " + teste, true); return; }
        }
        if (orig) Object.assign(orig, dados);
        else { dados.id = this.proximoId(spec.pre, lista); lista.push(dados); }
        this.fecharModal();
        if (tipo === "compromisso") this.sincronizarParcelas(orig ? orig.id : dados.id);
        this.salvar(spec.lista, "parcelas");
        this.toast(spec.rot + (orig ? " atualizado." : " criado."));
      } });
    this.modalCtx = { tipo, reg, rerender: () => { $("#modal-form").innerHTML = corpo(); } };
  },
  async excluir(tipo, id) {
    const mapa = { movMeta: "movMetas", subcategoria: "subcategorias" };
    const spec = FORMS[tipo], listaNome = spec ? spec.lista : mapa[tipo];
    const lista = this.d[listaNome];
    const reg = lista.find((x) => x.id === id); if (!reg) return;
    let aviso = "";
    if (tipo === "lancamento") {
      const l = this.v.L.find((x) => x.id === id);
      if (l && l.vinculos.length) aviso = `<br><br><b>Atenção:</b> está vinculado a ${esc(l.vinculos.join(", "))}.
        Excluir pode reabrir uma parcela já dada como paga. Se a intenção é apenas anular o efeito
        financeiro mantendo o histórico, use <b>Cancelar</b>.`;
    }
    if (tipo === "conta" || tipo === "cartao" || tipo === "investimento") {
      const n = this.d.lancamentos.filter((l) => l.origemId === id || l.destinoId === id).length;
      if (n) aviso = `<br><br><b>Atenção:</b> ${n} lançamento(s) apontam para este cadastro e ficarão órfãos.
        Prefira mudar o status para Inativo.`;
    }
    if (tipo === "compromisso") aviso = `<br><br>O cronograma de parcelas também será apagado.`;
    if (tipo === "meta") aviso = `<br><br>As movimentações de reserva desta meta também serão apagadas.`;
    const ok = await this.confirmar("Excluir " + (spec ? spec.rot.toLowerCase() : "registro"),
      `Excluir <b>${esc(reg.nome || reg.descricao || reg.id)}</b>?${aviso}`, "Excluir");
    if (!ok) return;
    const i = lista.indexOf(reg); lista.splice(i, 1);
    const extra = [listaNome];
    if (tipo === "compromisso") {
      this.d.parcelas = this.d.parcelas.filter((p) => p.compromissoId !== id); extra.push("parcelas");
    }
    if (tipo === "meta") {
      this.d.movMetas = this.d.movMetas.filter((m) => m.metaId !== id); extra.push("movMetas");
    }
    this.fecharModal(); this.salvar(...extra); this.toast("Registro excluído.");
  },
  mudarStatus(id, st) {
    const l = this.d.lancamentos.find((x) => x.id === id); if (!l) return;
    l.status = st;
    if (st === "CANCELADO" && !/CANCELADO/.test(l.obs || ""))
      l.obs = (l.obs ? l.obs + " · " : "") + "CANCELADO em " + Fmt.data(this.d.config.dataRef);
    this.salvar("lancamentos");
    this.toast(st === "CANCELADO" ? "Lançamento cancelado: o histórico fica, o efeito financeiro sai."
      : "Lançamento marcado como realizado.");
  },

  /* ------------------------------------------------------- parcelas */
  sincronizarParcelas(cmpId) {
    const c = this.d.compromissos.find((x) => x.id === cmpId); if (!c) return;
    const antigas = new Map(this.d.parcelas.filter((p) => p.compromissoId === cmpId).map((p) => [p.num, p]));
    const novas = [];
    for (let i = 1; i <= c.qtd; i++) {
      const venc = PASSO_MES[c.periodicidade]
        ? Dt.diaMes(...(() => { const b = Dt.addMeses(c.primeira, (i - 1) * PASSO_MES[c.periodicidade]);
            const p = Dt.parts(b); return [p.y, p.m, c.dia || p.d]; })())
        : Dt.addDias(c.primeira, (i - 1) * (PASSO_DIA[c.periodicidade] || 30));
      const old = antigas.get(i);
      novas.push({ id: old ? old.id : this.proximoId("PAR", [...this.d.parcelas, ...novas]),
        compromissoId: cmpId, num: i, vencimento: venc, valor: c.valorParcela, obs: old?.obs || "" });
    }
    this.d.parcelas = this.d.parcelas.filter((p) => p.compromissoId !== cmpId).concat(novas);
  },
  pagarParcela(parcelaId) {
    const p = this.v.parcelas.find((x) => x.id === parcelaId); if (!p) return;
    const c = this.d.compromissos.find((x) => x.id === p.compromissoId);
    const proj = this.d.lancamentos.find((l) => l.parcelaId === parcelaId && l.status === "PROJETADO");
    const contas = c.entidadeTipo === "CARTAO" ? optsDe(this.d.cartoes) : optsDe(this.d.contas);
    this.modal({ titulo: `Pagar parcela ${p.rotulo} — ${c.nome}`, ok: "Registrar pagamento",
      corpo: `${proj ? `<div class="aviso-box i">Já existe um lançamento projetado para esta parcela.
          Ele será convertido em realizado, sem criar uma segunda linha.</div>` : ""}
        <div class="fgrid">
          ${UI.txt("data", "Data do pagamento", this.d.config.dataRef, { tipo: "date" })}
          ${UI.txt("valor", "Valor pago (Gs.)", p.valor, { tipo: "number" })}
          ${UI.sel("entidadeId", c.entidadeTipo === "CARTAO" ? "Cartão" : "Conta", contas, c.entidadeId)}
          ${UI.txt("obs", "Observação", "", { full: 1 })}
        </div>`,
      onOk: (f) => {
        const data = f.elements.data.value, valor = Number(f.elements.valor.value), eid = f.elements.entidadeId.value;
        if (!(valor > 0)) { this.toast("Informe um valor maior que zero.", true); return; }
        if (proj) { Object.assign(proj, { status: "REALIZADO", data, valor, origemId: eid,
          obs: f.elements.obs.value || proj.obs }); }
        else {
          this.d.lancamentos.push({ id: this.proximoId("LAN", this.d.lancamentos), data,
            descricao: `${c.nome} - parcela ${p.rotulo}`,
            tipo: c.entidadeTipo === "CARTAO" ? "COMPRA_CARTAO" : "PAGAMENTO_PARCELA",
            status: "REALIZADO", valor, origemTipo: c.entidadeTipo, origemId: eid,
            destinoTipo: "EXTERNO", destinoId: "", categoriaId: c.categoriaId,
            subcategoriaId: c.subcategoriaId, forma: c.entidadeTipo === "CARTAO" ? "Crédito" : "Transferência",
            compromissoId: c.id, parcelaId: p.id, obs: f.elements.obs.value || "" });
        }
        this.fecharModal(); this.salvar("lancamentos");
        this.toast(`Parcela ${p.rotulo} paga.`);
      } });
  },

  /* --------------------------------------------------- investimentos */
  resgatar(invId) {
    const i = this.v.investimentos.find((x) => x.id === invId); if (!i) return;
    const catInv = this.d.categorias.find((c) => c.nome === "Investimentos");
    const catRec = this.d.categorias.find((c) => c.nome === "Receitas");
    const subDe = (cat, nome) => this.d.subcategorias.find((s) => s.categoriaId === cat?.id && s.nome === nome)?.id || "";
    this.modal({ titulo: "Resgatar — " + i.nome, ok: "Registrar resgate", largura: 700,
      corpo: `<div class="aviso-box i">O <b>principal</b> nunca vira receita: ele só muda de lugar.
          Se ainda houver rendimento não lançado, informe abaixo e o sistema cria uma linha separada
          de receita financeira.</div>
        <div class="fgrid">
          ${UI.txt("data", "Data do resgate", this.d.config.dataRef, { tipo: "date" })}
          ${UI.sel("contaId", "Conta que vai receber", optsDe(this.d.contas), this.d.contas[0]?.id)}
          ${UI.txt("valor", "Valor total resgatado (Gs.)", Math.round(i.saldo), { tipo: "number" })}
          ${UI.txt("rendimento", "Rendimento ainda não lançado (Gs.)", 0, { tipo: "number" })}
        </div>
        <p class="hint">Saldo atual: ${esc(Fmt.gs(i.saldo))} · principal ${esc(Fmt.gs(i.principal))} ·
          rendimento já reconhecido ${esc(Fmt.gs(i.rendNoSaldo))}</p>`,
      onOk: (f) => {
        const data = f.elements.data.value, contaId = f.elements.contaId.value;
        const valor = Number(f.elements.valor.value), rend = Number(f.elements.rendimento.value) || 0;
        if (!(valor > 0)) { this.toast("Informe um valor maior que zero.", true); return; }
        if (!contaId) { this.toast("Escolha a conta que vai receber.", true); return; }
        if (rend > 0) this.d.lancamentos.push({ id: this.proximoId("LAN", this.d.lancamentos), data,
          descricao: "Rendimento de " + i.nome, tipo: "RENDIMENTO", status: "REALIZADO", valor: rend,
          origemTipo: "EXTERNO", origemId: "", destinoTipo: "INVESTIMENTO", destinoId: i.id,
          categoriaId: catRec?.id || "", subcategoriaId: subDe(catRec, "Rendimento financeiro"),
          forma: "Transferência", obs: "Rendimento reconhecido no momento do resgate" });
        this.d.lancamentos.push({ id: this.proximoId("LAN", this.d.lancamentos), data,
          descricao: "Resgate de " + i.nome, tipo: "RESGATE", status: "REALIZADO", valor,
          origemTipo: "INVESTIMENTO", origemId: i.id, destinoTipo: "CONTA", destinoId: contaId,
          categoriaId: catInv?.id || "", subcategoriaId: subDe(catInv, "Resgate"),
          forma: "Transferência", obs: "Operação neutra: o principal não é receita" });
        this.fecharModal(); this.salvar("lancamentos");
        this.toast("Resgate registrado" + (rend > 0 ? " com o rendimento em linha separada." : "."));
      } });
  },

  /* ---------------------------------------------------------- metas */
  movMeta(metaId, tipoMov) {
    const m = this.v.metas.find((x) => x.id === metaId); if (!m) return;
    const rot = { RESERVA: "Reservar para", RETIRADA: "Retirar de", TRANSF_SAIDA: "Transferir de" }[tipoMov];
    const outras = this.d.metas.filter((x) => x.id !== metaId);
    this.modal({ titulo: `${rot} ${m.nome}`, ok: "Registrar",
      corpo: `<div class="aviso-box i">Isto é uma reserva lógica. O dinheiro continua na conta
          ${esc(m.contaNome || "vinculada")}; o que muda é o saldo disponível.</div>
        <div class="fgrid">
          ${UI.txt("data", "Data", this.d.config.dataRef, { tipo: "date" })}
          ${UI.txt("valor", "Valor (Gs.)", tipoMov === "RESERVA" ? "" : Math.round(m.reservado), { tipo: "number" })}
          ${tipoMov === "RETIRADA" ? UI.sel("destino", "Destino do valor retirado", DESTINOS_RET, "Saldo disponível") : ""}
          ${tipoMov === "TRANSF_SAIDA" ? UI.sel("metaDestinoId", "Meta de destino", optsDe(outras), outras[0]?.id) : ""}
          ${UI.txt("obs", "Observação", "", { full: 1 })}
        </div>
        <p class="hint">Reservado hoje: ${esc(Fmt.gs(m.reservado))} de ${esc(Fmt.gs(m.objetivo))}</p>`,
      onOk: (f) => {
        const valor = Number(f.elements.valor.value);
        if (!(valor > 0)) { this.toast("Informe um valor maior que zero.", true); return; }
        if (tipoMov !== "RESERVA" && valor > m.reservado + 0.5) {
          this.toast(`A meta tem apenas ${Fmt.gs(m.reservado)} reservados.`, true); return; }
        const data = f.elements.data.value, obs = f.elements.obs.value || "";
        const destino = f.elements.destino ? f.elements.destino.value : "";
        const metaDestinoId = f.elements.metaDestinoId ? f.elements.metaDestinoId.value : "";
        this.d.movMetas.push({ id: this.proximoId("MOV", this.d.movMetas), data, metaId,
          tipo: tipoMov, valor, destino, metaDestinoId, obs });
        if (tipoMov === "TRANSF_SAIDA" && metaDestinoId)
          this.d.movMetas.push({ id: this.proximoId("MOV", [...this.d.movMetas]), data,
            metaId: metaDestinoId, tipo: "TRANSF_ENTRADA", valor,
            obs: "Recebido de " + m.nome });
        this.fecharModal(); this.salvar("movMetas"); this.toast("Movimentação registrada.");
      } });
  },
  encerrarMeta(metaId, novoStatus) {
    const m = this.v.metas.find((x) => x.id === metaId); if (!m) return;
    const outras = this.d.metas.filter((x) => x.id !== metaId && x.status === "Ativa");
    const temSaldo = m.reservado > 0.5;
    this.modal({ titulo: (novoStatus === "Concluída" ? "Concluir" : "Cancelar") + " meta — " + m.nome,
      ok: novoStatus === "Concluída" ? "Concluir meta" : "Cancelar meta",
      corpo: `<p style="margin:0;max-width:64ch">Objetivo ${esc(Fmt.gs(m.objetivo))} ·
          acumulado ${esc(Fmt.gs(m.reservado))} · ${esc(Fmt.pct(m.pct))} concluído.</p>
        ${temSaldo ? `<div class="fgrid">
          ${UI.txt("data", "Data", this.d.config.dataRef, { tipo: "date" })}
          ${UI.sel("acao", "O que fazer com o valor reservado?", [
            { v: "manter", t: "Manter reservado" },
            { v: "liberar", t: "Liberar para o saldo disponível" },
            ...(outras.length ? [{ v: "transferir", t: "Transferir para outra meta" }] : []),
          ], "liberar")}
          ${outras.length ? UI.sel("metaDestinoId", "Meta de destino", optsDe(outras), outras[0]?.id) : ""}
        </div>` : `<div class="aviso-box i">A meta não tem valor reservado; nada precisa ser decidido.</div>`}`,
      onOk: (f) => {
        const reg = this.d.metas.find((x) => x.id === metaId);
        reg.status = novoStatus;
        reg.conclusao = temSaldo ? f.elements.data.value : this.d.config.dataRef;
        if (temSaldo) {
          const acao = f.elements.acao.value, data = f.elements.data.value;
          if (acao === "liberar")
            this.d.movMetas.push({ id: this.proximoId("MOV", this.d.movMetas), data, metaId,
              tipo: novoStatus === "Concluída" ? "LIBERACAO_CONCLUSAO" : "LIBERACAO_CANCELAMENTO",
              valor: m.reservado, destino: "Saldo disponível",
              obs: "Meta " + novoStatus.toLowerCase() + ": valor liberado" });
          else if (acao === "transferir") {
            const dest = f.elements.metaDestinoId.value;
            this.d.movMetas.push({ id: this.proximoId("MOV", this.d.movMetas), data, metaId,
              tipo: "TRANSF_SAIDA", valor: m.reservado, destino: "Outra meta", metaDestinoId: dest,
              obs: "Meta " + novoStatus.toLowerCase() + ": saldo transferido" });
            this.d.movMetas.push({ id: this.proximoId("MOV", [...this.d.movMetas]), data, metaId: dest,
              tipo: "TRANSF_ENTRADA", valor: m.reservado, obs: "Recebido de " + m.nome });
          }
        }
        this.fecharModal(); this.salvar("metas", "movMetas");
        this.toast("Meta " + novoStatus.toLowerCase() + ". O histórico permanece.");
      } });
  },

  /* --------------------------------------------------- recorrencias */
  gerarRecorrencia(recId) {
    const r = this.d.recorrencias.find((x) => x.id === recId); if (!r) return;
    const existentes = new Set(this.d.lancamentos.filter((l) => l.recorrenciaId === recId).map((l) => l.data));
    const novas = [];
    for (let i = 0; i < r.ocorrencias; i++) {
      let data;
      if (PASSO_MES[r.periodicidade]) {
        const b = Dt.addMeses(r.inicio, i * PASSO_MES[r.periodicidade]), p = Dt.parts(b);
        data = Dt.diaMes(p.y, p.m, r.dia || p.d);
      } else data = Dt.addDias(r.inicio, i * (PASSO_DIA[r.periodicidade] || 30));
      if (existentes.has(data)) continue;
      novas.push({ data, descricao: r.descricao, tipo: r.tipo,
        status: data <= this.d.config.dataRef ? "REALIZADO" : "PROJETADO", valor: r.valor,
        origemTipo: r.origemTipo, origemId: r.origemId, destinoTipo: r.destinoTipo,
        destinoId: r.destinoId, categoriaId: r.categoriaId, subcategoriaId: r.subcategoriaId,
        forma: r.forma, recorrenciaId: r.id, obs: "Gerado pela recorrência " + r.id });
    }
    if (!novas.length) { this.toast("Todas as ocorrências desta recorrência já existem."); return; }
    this.confirmar("Gerar lançamentos", `Serão criados <b>${novas.length}</b> lançamento(s) a partir de
      <b>${esc(r.descricao)}</b>. Os que caem até a data de referência entram como realizados;
      os demais como projetados. Ocorrências que já existem não são duplicadas.`, "Gerar")
      .then((ok) => {
        if (!ok) return;
        for (const n of novas) { n.id = this.proximoId("LAN", this.d.lancamentos); this.d.lancamentos.push(n); }
        this.salvar("lancamentos"); this.toast(novas.length + " lançamento(s) gerados.");
      });
  },

  /* ----------------------------------------------------------- guia */
  guiaFazer(passoId) {
    const p = Guia.passos(this.v).find((x) => x.id === passoId); if (!p) return;
    this.fecharFolha();
    this.rota = p.rota; this.render();
    if (p.novo) setTimeout(() => this.editar(p.novo, null), 80);
  },
  guiaMarcar(passoId, chave) {
    const c = this.d.config;
    c[chave] = Array.from(new Set([...(c[chave] || []), passoId]));
    this.salvar("config");
  },

  /* --------------------------------------------------------- perfis */
  async criarPerfil(comDemo) {
    const campo = $("#onb-nome");
    const nome = (campo ? campo.value.trim() : "") || (comDemo ? "Exemplo" : "Meu controle");
    if (comDemo && !DEMO) { this.toast("Os dados de exemplo não estão disponíveis nesta versão.", true); return; }
    const dados = comDemo ? JSON.parse(JSON.stringify(DEMO)) : dadosVazios();
    if (comDemo) dados.config = Object.assign(CONFIG_PADRAO(), dados.config);
    this.toast("Criando perfil…");
    try {
      const meta = await Store.criarPerfil(nome, dados);
      this.perfis = await Store.listarPerfis();
      await this.abrirPerfil(meta.id);
      if (comDemo) this.toast("Perfil de exemplo criado. Explore à vontade e apague quando quiser.");
      else {
        this.d.config.guiaAtivo = true; this.d.config.guiaOculto = false;
        Store.marcar("config");
        this.rota = "painel"; this.render();
        Guia.abrirBoasVindas(0);
      }
    } catch (e) { console.error(e); this.toast("Não foi possível criar o perfil: " + (e?.message || e), true); }
  },
  renomearPerfil(id) {
    const p = this.perfis.find((x) => x.id === id); if (!p) return;
    this.modal({ titulo: "Renomear perfil", corpo: UI.txt("nome", "Nome", p.nome, { full: 1 }),
      onOk: async (f) => {
        const nome = f.elements.nome.value.trim(); if (!nome) return;
        await Store.renomearPerfil(id, nome);
        this.perfis = await Store.listarPerfis();
        if (id === Store.pid) this.perfilNome = nome;
        this.fecharModal(); this.render(); this.toast("Perfil renomeado.");
      } });
  },
  async apagarPerfil(id) {
    const p = this.perfis.find((x) => x.id === id); if (!p) return;
    const ok = await this.confirmar("Excluir perfil",
      `Todos os dados de <b>${esc(p.nome)}</b> serão apagados: lançamentos, cadastros, parcelas e metas.
       Isso não pode ser desfeito. Baixe uma cópia antes, se quiser.`, "Excluir tudo");
    if (!ok) return;
    this.fecharModal();
    await Store.excluirPerfil(id);
    this.perfis = await Store.listarPerfis();
    if (id === Store.pid) {
      this.pronto = false;
      if (this.perfis.length) await this.abrirPerfil(this.perfis[0].id);
      else this.renderOnboarding("Perfil excluído. Crie outro para continuar.");
    } else this.render();
    this.toast("Perfil excluído.");
  },

  /* ----------------------------------------------------------- dados */
  async exportar() {
    const nome = "caja-guarani-" + this.perfilNome.replace(/[^\w-]+/g, "-").toLowerCase()
      + "-" + this.d.config.dataRef + ".json";
    const txt = JSON.stringify({ versao: 1, perfil: this.perfilNome, dados: this.d }, null, 1);
    try {
      const dl = await claude.use("downloads");
      if (dl) { await dl.save({ filename: nome, data: txt }); this.toast("Cópia salva."); return; }
    } catch (e) { if (e && e.code === "declined") return; console.warn(e); }
    this.modal({ titulo: "Cópia de segurança", ok: "", largura: 760,
      corpo: `<p class="hint">Não foi possível baixar o arquivo por aqui. Selecione o texto abaixo,
        copie e cole em um arquivo <b>${esc(nome)}</b>.</p>
        <textarea class="inp mono" rows="16" readonly style="font-size:11px">${esc(txt)}</textarea>` });
  },
  importar() {
    this.modal({ titulo: "Restaurar de um arquivo", ok: "Restaurar", largura: 760,
      corpo: `<div class="aviso-box a">Isto substitui <b>todos</b> os dados do perfil atual
          (${esc(this.perfilNome)}). Baixe uma cópia antes.</div>
        <div class="field"><label>Arquivo .json</label><input class="inp" type="file" name="arq" accept=".json"></div>
        <div class="field"><label>Ou cole o conteúdo aqui</label>
          <textarea class="inp mono" name="txt" rows="10" style="font-size:11px"></textarea></div>`,
      onOk: async (f) => {
        let txt = f.elements.txt.value.trim();
        const arq = f.elements.arq.files[0];
        if (!txt && arq) txt = await arq.text();
        if (!txt) { this.toast("Escolha um arquivo ou cole o conteúdo.", true); return; }
        let obj; try { obj = JSON.parse(txt); } catch (e) { this.toast("Arquivo inválido: não é um JSON.", true); return; }
        const novo = obj.dados || obj;
        if (!novo || !Array.isArray(novo.lancamentos)) { this.toast("Arquivo inválido: não parece uma cópia do sistema.", true); return; }
        this.d = Object.assign(dadosVazios(), novo);
        this.d.config = Object.assign(CONFIG_PADRAO(), novo.config || {});
        this.fecharModal();
        await Store.salvarTudo(this.d);
        this.recalc(); this.render();
        this.toast("Dados restaurados.");
      } });
  },
  async zerar() {
    const ok = await this.confirmar("Apagar lançamentos",
      `Os <b>${this.d.lancamentos.length}</b> lançamentos e as movimentações de metas serão apagados.
       Contas, cartões, investimentos, categorias, compromissos e metas continuam cadastrados.`, "Apagar");
    if (!ok) return;
    this.d.lancamentos = []; this.d.movMetas = [];
    this.fecharModal(); this.salvar("lancamentos", "movMetas");
    this.toast("Lançamentos apagados. Os cadastros continuam no lugar.");
  },
});

App.boot();
</script>

    oque: `O mês fechado em duas leituras: <b>resultado</b> (receitas menos despesas por competência) e <b>fluxo de caixa</b> (o que entrou e saiu de fato). Os dois quase nunca são iguais, e é isso mesmo: a compra no cartão é despesa hoje e saída de caixa no mês que vem.`,
    ligacoes: [["categorias", "A abertura por categoria e subcategoria usa o cadastro"],

    problemas: [["Resultado e fluxo de caixa estão diferentes", "É o comportamento correto, pelo motivo acima."],

  relAnual: { t: "Relatório anual",
    oque: `Os doze meses lado a lado, somando realizado e projetado, com totais, médias, maior e menor mês, categoria que mais pesou e a evolução do patrimônio no ano.`,
    ligacoes: [["relMensal", "Cada linha é o mês detalhado no relatório mensal"],
      ["patrimonio", "A evolução do ano vem da tela de patrimônio"]],

    ligacoes: [["contas", "Saldo das contas entra nos ativos"],
      ["investimentos", "Saldo investido entra nos ativos"],
      ["cartoes", "Dívida de cartão entra nos passivos"],
      ["compromissos", "Parcelas a vencer entram nos passivos"], ["bens", "Bens entram só no total"]],
    problemas: [["O patrimônio total é muito maior que o financeiro", "A diferença são os bens cadastrados. É esperado."],
      ["A evolução não bate com a posição atual",

    problemas: [["A média de despesa está estranha", "Ela usa os 6 meses anteriores ao mês corrente. Com pouco histórico, ela distorce."],
      ["A renda comprometida deu acima de 100%", "Você tem mais parcelas nos próximos 12 meses do que renda média. É um sinal real, não um erro."]] },
  alertas: { t: "Alertas",
    oque: `Cada linha é um número seu que passou de um limite que você mesmo definiu em Configurações. “Exigem ação” é o que já aconteceu; “merecem atenção” é o que está para acontecer.`,
    ligacoes: [["config", "Todos os limites ficam em Configurações"],
      ["compromissos", "Parcelas atrasadas e a vencer"], ["cartoes", "Limite e vencimento de fatura"],

      ["Um alerta de integridade apareceu",

    oque: `Antes de você confiar em qualquer relatório, esta tela recalcula cada número por um caminho diferente e compara. Saldo de conta, dívida de cartão, principal mais rendimento, reservas de meta, soma dos status de parcela, ativos menos passivos. Se der falha, algum dado está inconsistente.`,
    ligacoes: [["lancamentos", "Quase toda falha aponta para um lançamento"],
      ["compromissos", "Falhas de parcela vêm daqui"], ["alertas", "As mesmas falhas aparecem como alerta de integridade"]],
    problemas: [["Deu FALHA em “nenhum lançamento com erro de validação”",

      ["Deu FALHA em saldo de conta", "Raro. Exporte uma cópia em Configurações e me mande: é um caso para eu olhar."]] },
  config: { t: "Configurações",
    oque: `Os parâmetros do sistema (datas de referência e limites de alerta), a gestão dos perfis e a cópia de segurança. Um perfil é um conjunto de dados independente: dá para manter o exemplo e o seu ao mesmo tempo.`,
    ligacoes: [["alertas", "Os limites daqui definem os alertas"],
      ["painel", "A data de referência muda o que é passado e o que é futuro em todas as telas"]],
    problemas: [["A etiqueta diz “salvo neste navegador”",
      "O banco online não respondeu. Os dados existem, mas só naquele aparelho. Baixe uma cópia e recarregue a página."],
      ["Quero recomeçar do zero", "Crie um perfil vazio em vez de apagar registro por registro. O perfil antigo continua lá."],
      ["Perdi dados", "Restaure a partir da última cópia em JSON. Vale baixar uma por mês."]] },
};
</script>
<script>
"use strict";
/* ==================================================================== */
/*  GUIA DE PRIMEIROS PASSOS                                             */
/* ==================================================================== */
const Guia = {
  passos(v) {
    const d = v.dRaw, cfg = d.config;
    const feitos = cfg.guiaFeitos || [], pulados = cfg.guiaPulados || [];
    const temLanc = (t) => d.lancamentos.some((l) => l.tipo === t && l.status !== "CANCELADO");
    return [
      { id: "inst", t: "Cadastre seu banco", op: true, rota: "instituicoes", novo: "instituicao",
        d: "Ueno, Continental, Atlas, o que você usar. Serve para agrupar contas, cartões e investimentos.",
        ok: d.instituicoes.length > 0 },
      { id: "conta", t: "Cadastre a conta e o saldo de hoje", rota: "contas", novo: "conta",
        d: "O passo mais importante. Pegue o saldo do extrato e a data dele: o sistema calcula tudo a partir daí, somando entradas e subtraindo saídas.",
        ok: d.contas.length > 0 },
      { id: "cartao", t: "Cadastre seu cartão de crédito", op: true, rota: "cartoes", novo: "cartao",
        d: "Informe o limite, o dia do fechamento, o dia do vencimento e quanto você já deve hoje. O ciclo da fatura passa a ser calculado sozinho.",
        ok: d.cartoes.length > 0 },
      { id: "cat", t: "Dê uma olhada nas categorias", manual: true, rota: "categorias",
        d: "Já vêm 13 categorias e 54 subcategorias prontas. Renomeie, apague o que não usa e acrescente o que faltar — é assim que os relatórios vão ficar com a sua cara.",
        ok: false },
      { id: "receita", t: "Lance sua primeira receita", rota: "lancamentos", novo: "lancamento",
        d: "Seu salário, por exemplo: tipo Receita, origem Externo, destino a sua conta. Veja o saldo mudar na hora.",
        ok: temLanc("RECEITA") },
      { id: "despesa", t: "Lance sua primeira despesa", rota: "lancamentos", novo: "lancamento",
        d: "O aluguel, o supermercado. Se foi no cartão, escolha “Compra no cartão”: a despesa conta hoje, mas o dinheiro só sai da conta quando você pagar a fatura.",
        ok: temLanc("DESPESA") || temLanc("COMPRA_CARTAO") },
      { id: "rec", t: "Cadastre o que se repete todo mês", op: true, rota: "recorrencias", novo: "recorrencia",
        d: "Salário, aluguel, internet. Depois clique em Gerar lançamentos e o sistema projeta os próximos meses sozinho.",
        ok: d.recorrencias.length > 0 },
      { id: "cmp", t: "Cadastre um parcelamento", op: true, rota: "compromissos", novo: "compromisso",
        d: "Um financiamento ou uma compra parcelada. Diga quantas parcelas já pagou antes e o cronograma inteiro sai pronto.",
        ok: d.compromissos.length > 0 },
      { id: "meta", t: "Crie uma meta", op: true, rota: "metas", novo: "meta",
        d: "Separe dinheiro sem tirar da conta. O saldo continua lá; o que muda é quanto está disponível.",
        ok: d.metas.length > 0 },
      { id: "conf", t: "Termine passando na Conferência", manual: true, rota: "testes",
        d: "Sempre que tiver dúvida se um número está certo, é essa a tela. Ela recalcula tudo por outro caminho e avisa se algo não fecha.",
        ok: false },
    ].map((p) => ({ ...p, ok: p.ok || feitos.includes(p.id), pulado: pulados.includes(p.id) }));
  },
  progresso(v) {
    const p = this.passos(v), obr = p.filter((x) => !x.op);
    return { feitos: obr.filter((x) => x.ok).length, total: obr.length,
      todos: p.filter((x) => x.ok || x.pulado).length, qtd: p.length,
      completo: obr.every((x) => x.ok) };
  },
  ativo(v) {
    const cfg = v.dRaw.config;
    if (cfg.guiaOculto) return false;
    return cfg.guiaAtivo === true || (cfg.guiaAtivo === undefined && v.L.length < 12);
  },
  card(v) {
    if (!this.ativo(v)) return "";
    const ps = this.passos(v), pr = this.progresso(v);
    return `<section class="guia">
      <div class="guia-h"><h3>Primeiros passos</h3>
        ${UI.tag(`${pr.feitos} de ${pr.total} essenciais`, pr.completo ? "bom" : "acc")}
        <div class="sp"></div>
        ${pr.completo ? `<button class="btn btn-pri btn-sm" data-act="guia-fechar">Concluir guia</button>`
          : `<button class="btn btn-sm" data-act="guia-fechar">Esconder</button>`}
      </div>
      <div style="padding:0 16px 12px">${UI.progresso(pr.todos / pr.qtd)}</div>
      <div class="guia-b">${ps.map((p, i) => `
        <div class="passo${p.ok ? " ok" : ""}${p.pulado ? " ok" : ""}">
          <span class="pn">${p.ok || p.pulado ? "✓" : i + 1}</span>
          <div class="pt"><b>${esc(p.t)}${p.op ? " " + UI.tag("opcional", "neutro") : ""}</b>
            <span>${esc(p.d)}</span>
            ${p.ok || p.pulado ? "" : `<div class="pa">
              <button class="btn btn-pri btn-sm" data-act="guia-fazer" data-passo="${p.id}">Fazer agora</button>
              ${p.manual ? `<button class="btn btn-sm" data-act="guia-marcar" data-passo="${p.id}">Já conferi</button>`
                : `<button class="btn btn-sm" data-act="guia-pular" data-passo="${p.id}">Pular</button>`}</div>`}
          </div></div>`).join("")}</div>
      <div style="padding:11px 16px;border-top:1px solid var(--line);background:var(--surface)">
        <span class="hint">Some quando você concluir. Para trazer de volta: Configurações → Mostrar guia.</span>
      </div></section>`;
  },
  BOASVINDAS: [
    { t: "Uma regra explica o sistema inteiro",
      c: `Toda operação sai de uma <b>origem</b> e vai para um <b>destino</b>. Cada um deles é uma conta,
        um cartão, um investimento, ou <i>externo</i> — o mundo fora do seu controle: o empregador, o supermercado.
        <br><br>Seu salário é <b>Externo → Conta</b>. O supermercado no débito é <b>Conta → Externo</b>.
        Passar dinheiro da corrente para a poupança é <b>Conta → Conta</b>, e por isso não é receita nem despesa.
        <br><br>É só isso. Saldos, dívidas, fluxo de caixa, relatórios e patrimônio saem todos daí,
        sem você digitar nada duas vezes.` },
    { t: "O cartão de crédito é onde quase todo controle se perde",
      c: `A compra no cartão é a <b>despesa</b>, no dia em que você comprou. O pagamento da fatura
        <b>não é despesa nenhuma</b>: é só o dinheiro saindo da conta para abater a dívida.
        <br><br>Se você lançasse os dois como despesa, gastaria duas vezes no papel. Aqui isso é impossível:
        o tipo “Pagamento de fatura” é neutro por construção.
        <br><br>Vale o mesmo para investimento: aportar não é gastar, resgatar não é ganhar. Só o rendimento é receita.` },
    { t: "Realizado, projetado e cancelado",
      c: `<b>Realizado</b> é dinheiro que já se moveu — é o que forma o seu saldo.
        <b>Projetado</b> é o que você espera; aparece no fluxo futuro e não encosta no saldo.
        Quando acontecer de verdade, você troca o status da mesma linha, sem criar outra.
        <br><br><b>Cancelado</b> é para o lançamento errado: o histórico fica, o efeito financeiro some.
        Use isso em vez de excluir.
        <br><br>Na dúvida sobre qualquer tela, use o botão <b>?</b> no topo: ele explica o que a tela faz,
        como ela se liga às outras e o que verificar se algo não bater.` },
  ],
  abrirBoasVindas(i) {
    const s = this.BOASVINDAS[i], fim = i === this.BOASVINDAS.length - 1;
    App.modal({ titulo: `Como funciona — ${i + 1} de ${this.BOASVINDAS.length}`, largura: 640,
      ok: fim ? "Começar" : "Continuar",
      corpo: `<h3 style="font-size:17px;margin-bottom:8px">${esc(s.t)}</h3>
        <p style="margin:0;max-width:62ch;line-height:1.6">${s.c}</p>
        <div class="row" style="gap:5px;margin-top:6px">${this.BOASVINDAS.map((_, n) =>
          `<i style="width:${n === i ? 22 : 7}px;height:7px;border-radius:4px;display:block;
            background:${n === i ? "var(--accent)" : "var(--line-2)"}"></i>`).join("")}</div>`,
      onOk: () => { App.fecharModal(); if (!fim) this.abrirBoasVindas(i + 1); else App.render(); } });
    if (i > 0) {
      const f = $(".modal-f");
      f.insertAdjacentHTML("afterbegin",
        `<button class="btn" data-act="guia-voltar" data-i="${i - 1}" style="margin-right:auto">Voltar</button>`);
    }
  },
};

/* ------------------------------------------------- icones da barra ---- */
const ICO = {
  painel: '<path d="M3 3h7v7H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 14h7v7H3z"/>',
  lancamentos: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  contas: '<path d="M3 7h15a3 3 0 013 3v7a3 3 0 01-3 3H5a2 2 0 01-2-2z"/><path d="M3 7V6a2 2 0 012-2h11"/><circle cx="17" cy="13.5" r="1.3"/>',
  analise: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  mais: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
};
const ico = (k) => `<svg class="mi" width="21" height="21" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
  aria-hidden="true">${ICO[k]}</svg>`;
</script>
